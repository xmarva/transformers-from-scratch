[project]
name = "transformers-from-scratch"
version = "0.1.0"
description = "Helpers for the course 'Transformers: from scratch to production'"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "numpy>=1.24"]

[dependency-groups]
dev = [
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "pandas>=2.0",
    "pip>=24",  # lesson 7 installs its package with pip, as a reader would
    "pytest>=8.0",
    "ruff>=0.6",
    "sacrebleu>=2.4",
    "wandb>=0.19",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "tokenizers>=0.19",
    "torch>=2.4",
    "transformers>=4.45",
]
# the posts in articles/: cortical surfaces and atlases, colour spaces, sample images
articles = ["nilearn>=0.11", "nibabel>=5.2", "colour-science>=0.4.4", "scikit-image>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfs"]

[tool.ruff]
line-length = 120
target-version = "py310"
# lessons 7 and 8 write classes in parts with %%writefile -a, which can't parse as one file; the code they
# write is linted where it lives, in perevod/
extend-exclude = ["notebooks", "lessons/07_package/lesson.py", "lessons/08_serving/lesson.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# the tools import each other by file name; without this, CI (where a package called "build" exists) and a laptop
# sort these imports differently
known-first-party = ["build", "citations", "paragraphs", "tfs", "tools"]

[tool.ruff.lint.per-file-ignores]
# lesson sources are notebooks: imports appear where they are first explained, names like SEED come from the shared
# setup cell (undefined names are caught by running the lesson in CI), markdown cells hold long links (code lines
# are kept short by tests/test_lessons.py), and zip() over a sequence and its shifted copy is unequal by design
"lessons/**/*.py" = ["E402", "I001", "F821", "E501", "B905"]
# the setup cell imports helpers for the lesson cells that follow it
"lessons/_shared/*.py" = ["E402", "I001", "F821", "E501", "B905", "F401"]
"architectures/**/*.py" = ["E402", "I001", "F821", "E501", "B905"]
"architectures/_shared/*.py" = ["E402", "I001", "F821", "E501", "B905", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI runs on Linux without a GPU: take PyTorch's CPU wheels there instead of gigabytes of CUDA libraries
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
