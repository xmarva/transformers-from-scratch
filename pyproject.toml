[project]
name = "transformers-from-scratch"
version = "0.1.0"
description = "Helpers for the course 'Transformers: from scratch to production'"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "numpy>=1.24"]

[dependency-groups]
dev = [
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "pandas>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "tokenizers>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfs"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# lesson sources are notebooks: imports appear where they are first explained
"lessons/**/*.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
