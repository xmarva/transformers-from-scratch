name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release tags: a lesson's package is checked against the release it made
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q
      - name: Notebooks are built from their sources
        run: uv run python tools/build.py --check

  smoke:
    # every lesson runs top to bottom on a tiny slice of data, as a learner would run it
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --group dev
      - name: Run lessons
        run: uv run python tools/run.py --smoke --timeout 900
