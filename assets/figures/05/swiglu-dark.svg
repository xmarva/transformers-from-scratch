<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The feed-forward layer, two ways. 2017: x times W1, ReLU, times W2. SwiGLU: x goes through two matrices; one result passes SiLU and becomes a gate, multiplied element by element with the other, and the product goes through the third matrix. Three matrices instead of two, so each is two thirds as wide to keep the number of weights">
<title>The feed-forward layer, two ways. 2017: x times W1, ReLU, times W2. SwiGLU: x goes through two matrices; one result passes SiLU and becomes a gate, multiplied element by element with the other, and the product goes through the third matrix. Three matrices instead of two, so each is two thirds as wide to keep the number of weights</title>
