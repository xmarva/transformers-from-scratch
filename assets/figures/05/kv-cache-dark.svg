<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Decoding the fifth token. Without a cache the decoder recomputes keys and values for all five positions at every step. With a cache, the keys and values of the first four positions are kept from the earlier steps, and only the new token&#x27;s are computed">
<title>Decoding the fifth token. Without a cache the decoder recomputes keys and values for all five positions at every step. With a cache, the keys and values of the first four positions are kept from the earlier steps, and only the new token&#x27;s are computed</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="300" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">Writing token 5: recompute everything, or keep what you had</text>
<text x="14.0" y="102.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">without a cache</text>
<rect x="170.0" y="80.0" width="64.0" height="34.0" rx="9" fill="#9C8CF5" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="202.0" y="101.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">k,v 1</text>
<rect x="244.0" y="80.0" width="64.0" height="34.0" rx="9" fill="#9C8CF5" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="276.0" y="101.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">k,v 2</text>
