<text x="350.0" y="101.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">k,v 3</text>
<rect x="392.0" y="80.0" width="64.0" height="34.0" rx="9" fill="#9C8CF5" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="424.0" y="101.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">k,v 4</text>
<rect x="466.0" y="80.0" width="64.0" height="34.0" rx="9" fill="#9C8CF5" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="498.0" y="101.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">k,v 5</text>
<text x="560.0" y="102.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">computed now: 5</text>
<text x="14.0" y="212.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">with a KV cache</text>
<rect x="170.0" y="190.0" width="64.0" height="34.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="202.0" y="211.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">k,v 1</text>
<rect x="244.0" y="190.0" width="64.0" height="34.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="276.0" y="211.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">k,v 2</text>
<rect x="318.0" y="190.0" width="64.0" height="34.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="350.0" y="211.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">k,v 3</text>
<rect x="392.0" y="190.0" width="64.0" height="34.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="424.0" y="211.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">k,v 4</text>
<rect x="466.0" y="190.0" width="64.0" height="34.0" rx="9" fill="#9C8CF5" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="498.0" y="211.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">k,v 5</text>
<text x="560.0" y="212.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#F6C878">computed now: 1</text>
<text x="14.0" y="280.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">Every step adds one row; without the cache, step t redoes t rows.</text>
</svg>