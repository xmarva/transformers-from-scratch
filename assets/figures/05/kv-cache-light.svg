<text x="350.0" y="211.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">k,v 3</text>
<rect x="392.0" y="190.0" width="64.0" height="34.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="424.0" y="211.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">k,v 4</text>
<rect x="466.0" y="190.0" width="64.0" height="34.0" rx="9" fill="#6A55D8" stroke="#6A55D8" stroke-width="1.5"/>
<text x="498.0" y="211.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">k,v 5</text>
<text x="560.0" y="212.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#8A5508">computed now: 1</text>
<text x="14.0" y="280.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">Every step adds one row; without the cache, step t redoes t rows.</text>
</svg>