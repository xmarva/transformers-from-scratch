<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Rotary position embedding on one pair of dimensions. The query of the token at position m is rotated by m times theta, the key of the token at position n by n times theta. Their dot product depends on the angle between them, which changes by (n − m) times theta: only the distance between the tokens counts, not where the pair sits in the sentence">
<title>Rotary position embedding on one pair of dimensions. The query of the token at position m is rotated by m times theta, the key of the token at position n by n times theta. Their dot product depends on the angle between them, which changes by (n − m) times theta: only the distance between the tokens counts, not where the pair sits in the sentence</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="340" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">RoPE turns position into an angle</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">one pair of dimensions of a query q and a key k; θ = 0.5 radian per position</text>
<polyline points="40.0,190.0 220.0,190.0" fill="none" stroke="#5B6575" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="130.0,100.0 130.0,280.0" fill="none" stroke="#5B6575" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="130.0,190.0 205.2,162.6" fill="none" stroke="#D23F57" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-dec)"/>
<polyline points="130.0,190.0 91.2,139.1" fill="none" stroke="#0F8C7E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-enc)"/>
<text x="212.7" y="163.9" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#A82D42">q</text>
<text x="85.2" y="135.1" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">k</text>
<text x="50.0" y="92.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">q at 0, k at 2</text>
<text x="50.0" y="300.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">angle between: 107°</text>
<polyline points="290.0,190.0 470.0,190.0" fill="none" stroke="#5B6575" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="380.0,100.0 380.0,280.0" fill="none" stroke="#5B6575" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="380.0,190.0 358.0,113.1" fill="none" stroke="#D23F57" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-dec)"/>
<polyline points="380.0,190.0 326.5,225.1" fill="none" stroke="#0F8C7E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-enc)"/>
<text x="355.8" y="109.4" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#A82D42">q</text>
<text x="318.1" y="234.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">k</text>
<text x="300.0" y="92.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">q at 3, k at 5</text>
<text x="300.0" y="300.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">angle between: 107°</text>
<polyline points="540.0,190.0 720.0,190.0" fill="none" stroke="#5B6575" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="630.0,100.0 630.0,280.0" fill="none" stroke="#5B6575" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="630.0,190.0 551.7,206.5" fill="none" stroke="#D23F57" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-dec)"/>
<polyline points="630.0,190.0 661.2,245.9" fill="none" stroke="#0F8C7E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-enc)"/>
<text x="543.9" y="212.1" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#A82D42">q</text>
<text x="666.1" y="258.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">k</text>
<text x="550.0" y="92.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">q at 6, k at 8</text>
<text x="550.0" y="300.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">angle between: 107°</text>
<text x="14.0" y="326.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">Shift both tokens along the sentence and the angle between them stays: attention sees n − m.</text>
</svg>