<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-label="Three ways to connect a vision encoder to a language model. Cross-attention, as in Flamingo and Llama 3.2 Vision: the image never enters the token sequence; extra layers inside the language model attend to the image features. A resampler, as in BLIP-2 and the first Qwen-VL: a fixed set of learned queries reads the image and hands the language model a fixed number of tokens, 32 or 256. A projector, as in LLaVA and most models since: every patch vector becomes a token of the sequence">
<title>Three ways to connect a vision encoder to a language model. Cross-attention, as in Flamingo and Llama 3.2 Vision: the image never enters the token sequence; extra layers inside the language model attend to the image features. A resampler, as in BLIP-2 and the first Qwen-VL: a fixed set of learned queries reads the image and hands the language model a fixed number of tokens, 32 or 256. A projector, as in LLaVA and most models since: every patch vector becomes a token of the sequence</title>
