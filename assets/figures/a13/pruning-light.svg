<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-label="Pruning visual tokens inside the language model, as FastV does. All tokens pass through the first two layers. At layer two the image tokens are ranked by the attention they receive from the other tokens; only the most-attended ones, drawn dark, continue into the later layers, together with all the text tokens, and the rest, drawn light, are dropped. The later layers do less work, and the question is how much the answer suffers. A control drops the same number of image tokens at random">
<title>Pruning visual tokens inside the language model, as FastV does. All tokens pass through the first two layers. At layer two the image tokens are ranked by the attention they receive from the other tokens; only the most-attended ones, drawn dark, continue into the later layers, together with all the text tokens, and the rest, drawn light, are dropped. The later layers do less work, and the question is how much the answer suffers. A control drops the same number of image tokens at random</title>
