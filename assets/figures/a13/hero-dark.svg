<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="A vision-language model in one picture. A photo goes through a vision encoder, a Vision Transformer, and becomes a grid of patch vectors; a small projector turns each into a vector of the language model&#x27;s width; these visual tokens take the place of an image placeholder in the prompt, between the text tokens, and the language model reads the whole sequence and answers in words">
<title>A vision-language model in one picture. A photo goes through a vision encoder, a Vision Transformer, and becomes a grid of patch vectors; a small projector turns each into a vector of the language model&#x27;s width; these visual tokens take the place of an image placeholder in the prompt, between the text tokens, and the language model reads the whole sequence and answers in words</title>
