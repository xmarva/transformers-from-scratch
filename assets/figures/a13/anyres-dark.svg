<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">a 768×1024 photo in LLaVA-OneVision: 2×3 tiles of 384 px plus a thumbnail, 4,744 visual tokens</text>
