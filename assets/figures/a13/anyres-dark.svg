<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" role="img" aria-label="How LLaVA-OneVision cuts an image into tiles. A 768 by 1024 pixel image is fitted into the best of its candidate grids, 2 tiles wide and 3 high at 384 pixels each, with a thumbnail of the whole image beside them. Each tile gives 27 by 27 feature vectors. The tiles&#x27; features are joined into one map, the rows and columns that only cover padding are cut away, the map is shrunk if it holds more than nine tiles&#x27; worth, and a learned newline vector closes every row. The image costs 4744 tokens: 729 for the thumbnail and 73 rows of 54 plus a newline">
<title>How LLaVA-OneVision cuts an image into tiles. A 768 by 1024 pixel image is fitted into the best of its candidate grids, 2 tiles wide and 3 high at 384 pixels each, with a thumbnail of the whole image beside them. Each tile gives 27 by 27 feature vectors. The tiles&#x27; features are joined into one map, the rows and columns that only cover padding are cut away, the map is shrunk if it holds more than nine tiles&#x27; worth, and a learned newline vector closes every row. The image costs 4744 tokens: 729 for the thumbnail and 73 rows of 54 plus a newline</title>
