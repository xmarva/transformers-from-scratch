<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">the field converged on the simplest one: put the image into the sequence</text>
<text x="20.0" y="84.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">cross-attention</text>
<text x="20.0" y="102.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">Flamingo, Llama 3.2 Vision</text>
