<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-label="Pruning visual tokens inside the language model. All tokens pass through the first two layers. At layer two, the attention that the last prompt token pays to each image token ranks them; only the most-attended image tokens continue into the later layers, together with all the text tokens. The later layers do less work, and the question is how much the answer suffers">
<title>Pruning visual tokens inside the language model. All tokens pass through the first two layers. At layer two, the attention that the last prompt token pays to each image token ranks them; only the most-attended image tokens continue into the later layers, together with all the text tokens. The later layers do less work, and the question is how much the answer suffers</title>
