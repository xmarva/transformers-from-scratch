<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Qwen2-VL&#x27;s positions in three numbers. Each token has a time, a height and a width position. The 4 text tokens before the image count 0 to 3 in all three. The image&#x27;s 3 by 4 tokens keep the time position 4 and take height positions 4 to 6 and width positions 4 to 7, so neighbours in the picture are neighbours in position. The text after the image resumes at 8, the image&#x27;s start plus its larger side, not plus its 12 tokens">
<title>Qwen2-VL&#x27;s positions in three numbers. Each token has a time, a height and a width position. The 4 text tokens before the image count 0 to 3 in all three. The image&#x27;s 3 by 4 tokens keep the time position 4 and take height positions 4 to 6 and width positions 4 to 7, so neighbours in the picture are neighbours in position. The text after the image resumes at 8, the image&#x27;s start plus its larger side, not plus its 12 tokens</title>
