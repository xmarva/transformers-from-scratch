<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-label="The Transformer&#x27;s family as this course covers it, lesson 3, embeddings &amp; search, highlighted. From the 2017 Transformer: encoders (BERT, RoBERTa to ModernBERT, embeddings and search), decoders (GPT, modern LLMs, mixture of experts, the KV cache and latent attention, long context, Mamba and hybrids), encoder–decoders (T5 and BART, Whisper) and models beyond text (ViT, CLIP and SigLIP, vision–language models, diffusion transformers)">
