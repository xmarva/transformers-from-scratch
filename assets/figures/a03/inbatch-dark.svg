<text x="514.0" y="122.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">each row: softmax over</text>
<text x="514.0" y="142.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">cosine × 20</text>
<text x="514.0" y="182.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">target: the diagonal</text>
<text x="514.0" y="222.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">loss: cross-entropy,</text>
