<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-label="A search engine in three stages. All papers go to two retrievers, BM25 on words and a bi-encoder on meaning, each returning its top 100; reciprocal rank fusion merges the two rankings; a cross-encoder reads the query with each of the 50 best candidates and returns the final top five">
<title>A search engine in three stages. All papers go to two retrievers, BM25 on words and a bi-encoder on meaning, each returning its top 100; reciprocal rank fusion merges the two rankings; a cross-encoder reads the query with each of the 50 best candidates and returns the final top five</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="236" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">A search engine: cheap stages first, expensive ones on few candidates</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">each stage sees fewer documents and reads each of them more carefully</text>
<rect x="14.0" y="104.0" width="110.0" height="52.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="69.0" y="134.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">all papers</text>
<rect x="160.0" y="74.0" width="150.0" height="44.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="235.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">BM25: words</text>
<rect x="160.0" y="142.0" width="150.0" height="44.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="235.0" y="168.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">bi-encoder</text>
<polyline points="125.0,120.0 142.0,120.0 142.0,96.0 159.0,96.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="125.0,140.0 142.0,140.0 142.0,164.0 159.0,164.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="350.0" y="104.0" width="130.0" height="52.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="415.0" y="134.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">fusion (RRF)</text>
<polyline points="311.0,96.0 330.0,96.0 330.0,122.0 349.0,122.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="311.0,164.0 330.0,164.0 330.0,138.0 349.0,138.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="516.0" y="104.0" width="140.0" height="52.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="586.0" y="134.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">cross-encoder</text>
<polyline points="481.0,130.0 515.0,130.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="690.0" y="104.0" width="56.0" height="52.0" rx="9" fill="#F0B04A" stroke="#F0B04A" stroke-width="1.5"/>
<text x="718.0" y="134.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">top 5</text>
<polyline points="657.0,130.0 689.0,130.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="69.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">58k papers</text>
<text x="235.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">top 100 each</text>
<text x="415.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">top 50</text>
<text x="586.0" y="214.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">50 pairs read</text>
</svg>