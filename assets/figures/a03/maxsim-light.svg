<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="ColBERT&#x27;s MaxSim. Every query token is compared by cosine with every token of the document; each query token keeps only its best match, and the document&#x27;s score is the sum of these maxima. Here the query token &#x27;rotary&#x27; finds &#x27;rotation&#x27; and &#x27;position&#x27; finds &#x27;position&#x27;; the [MASK] tokens that pad the query also look for a match">
<title>ColBERT&#x27;s MaxSim. Every query token is compared by cosine with every token of the document; each query token keeps only its best match, and the document&#x27;s score is the sum of these maxima. Here the query token &#x27;rotary&#x27; finds &#x27;rotation&#x27; and &#x27;position&#x27; finds &#x27;position&#x27;; the [MASK] tokens that pad the query also look for a match</title>
<defs>
