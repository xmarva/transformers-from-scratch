<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Decoding step 5 without and with a cache. Without one, the decoder runs on all five tokens and recomputes the keys and values of the first four. With one, it runs on the fifth token only, appends its key and value to the cache, and attends to all five">
<title>Decoding step 5 without and with a cache. Without one, the decoder runs on all five tokens and recomputes the keys and values of the first four. With one, it runs on the fifth token only, appends its key and value to the cache, and attends to all five</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="300" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">Decoding step 5: what the decoder computes</text>
<text x="14.0" y="100.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#1D2430">without a cache</text>
<rect x="200.0" y="76.0" width="92.0" height="40.0" rx="9" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="246.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">K,V of 1</text>
<rect x="304.0" y="76.0" width="92.0" height="40.0" rx="9" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="350.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">K,V of 2</text>
<rect x="408.0" y="76.0" width="92.0" height="40.0" rx="9" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="454.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">K,V of 3</text>
<rect x="512.0" y="76.0" width="92.0" height="40.0" rx="9" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="558.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">K,V of 4</text>
<rect x="616.0" y="76.0" width="92.0" height="40.0" rx="9" fill="#FBE6EA" stroke="#D23F57" stroke-width="1.5"/>
<text x="662.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#A82D42" xml:space="preserve">K,V of 5</text>
<text x="200.0" y="140.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">5 positions, again</text>
<text x="14.0" y="212.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#1D2430">with a KV cache</text>
<rect x="200.0" y="188.0" width="92.0" height="40.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="246.0" y="212.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">cached 1</text>
<rect x="304.0" y="188.0" width="92.0" height="40.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="350.0" y="212.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">cached 2</text>
<rect x="408.0" y="188.0" width="92.0" height="40.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="454.0" y="212.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">cached 3</text>
<rect x="512.0" y="188.0" width="92.0" height="40.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="558.0" y="212.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">cached 4</text>
<rect x="616.0" y="188.0" width="92.0" height="40.0" rx="9" fill="#FBE6EA" stroke="#D23F57" stroke-width="1.5"/>
<text x="662.0" y="212.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#A82D42" xml:space="preserve">K,V of 5</text>
<text x="200.0" y="252.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">1 position, the rest kept</text>
<text x="14.0" y="290.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">Step t costs t positions without the cache, one with it: T²/2 against T for a whole sentence.</text>
</svg>