<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Beam search with a cache, beam size three. After a step, the three best continuations come from rows 0, 0 and 2 of the cache: row 1&#x27;s hypothesis died and row 0&#x27;s had two children. The cache is gathered with the index [0, 0, 2] so that each new beam&#x27;s row holds its parent&#x27;s keys and values">
<title>Beam search with a cache, beam size three. After a step, the three best continuations come from rows 0, 0 and 2 of the cache: row 1&#x27;s hypothesis died and row 0&#x27;s had two children. The cache is gathered with the index [0, 0, 2] so that each new beam&#x27;s row holds its parent&#x27;s keys and values</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="330" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">After each step, the cache follows the surviving hypotheses</text>
<text x="14.0" y="62.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">cache rows before</text>
<text x="470.0" y="62.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">beams after the step</text>
<rect x="14.0" y="78.0" width="250.0" height="42.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="139.0" y="103.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">row 0: Я думаю</text>
<rect x="14.0" y="140.0" width="250.0" height="42.0" rx="9" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="139.0" y="165.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">row 1: Я думал</text>
<rect x="14.0" y="202.0" width="250.0" height="42.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="139.0" y="227.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">row 2: Мне кажется</text>
<rect x="470.0" y="78.0" width="276.0" height="42.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="608.0" y="103.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">Я думаю, что</text>
<polyline points="268.0,99.0 466.0,99.0" fill="none" stroke="#9C8CF5" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-att)"/>
<rect x="470.0" y="140.0" width="276.0" height="42.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="608.0" y="165.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">Я думаю, это</text>
<polyline points="268.0,99.0 466.0,161.0" fill="none" stroke="#9C8CF5" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-att)"/>
<rect x="470.0" y="202.0" width="276.0" height="42.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="608.0" y="227.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">Мне кажется, что</text>
<polyline points="268.0,223.0 466.0,223.0" fill="none" stroke="#9C8CF5" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-att)"/>
<text x="14.0" y="286.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">row 1&#x27;s hypothesis fell out of the beam; row 0 had two children</text>
<text x="14.0" y="312.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">cache = cache[[0, 0, 2]]: one gather per step, before the next decoder call</text>
</svg>