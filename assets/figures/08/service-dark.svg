<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="How a request travels through perevod&#x27;s service: an HTTP request reaches uvicorn and FastAPI, which validates it and puts it into a queue; a batcher takes the requests that arrived within a few milliseconds, translates them as one batch in a worker thread, and answers each request with its own translation">
<title>How a request travels through perevod&#x27;s service: an HTTP request reaches uvicorn and FastAPI, which validates it and puts it into a queue; a batcher takes the requests that arrived within a few milliseconds, translates them as one batch in a worker thread, and answers each request with its own translation</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="250" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">A request&#x27;s way through perevod-server</text>
<rect x="14.0" y="80.0" width="132.0" height="44.0" rx="9" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="80.0" y="106.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">POST /translate</text>
<polyline points="148.0,102.0 162.0,102.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="164.0" y="80.0" width="132.0" height="44.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="230.0" y="106.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">FastAPI checks</text>
<polyline points="298.0,102.0 312.0,102.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="314.0" y="80.0" width="132.0" height="44.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="380.0" y="106.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">queue</text>
<polyline points="448.0,102.0 462.0,102.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="464.0" y="80.0" width="132.0" height="44.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="530.0" y="106.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">batcher: ≤16, 5 ms</text>
<polyline points="598.0,102.0 612.0,102.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="614.0" y="80.0" width="132.0" height="44.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="680.0" y="106.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">model, a thread</text>
<polyline points="680.0,128.0 680.0,168.0 80.0,168.0 80.0,128.0" fill="none" stroke="#3CC2B0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-enc)"/>
<text x="150.0" y="192.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">each request gets its own translation back, from its own future</text>
<text x="14.0" y="232.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">The model loads once, when the server starts; requests share it through the queue.</text>
