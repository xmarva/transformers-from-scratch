<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-label="The structure of an image, top to bottom. A tag points to an image index. The index lists one manifest per platform by digest. A manifest lists a config and the layers by digest. The config holds the environment, the command and the hash of each unpacked layer; each layer is a gzipped tar archive of the files one Dockerfile step changed. Each level names the next by its sha256, so the digest at the top fixes every byte below it">
<title>The structure of an image, top to bottom. A tag points to an image index. The index lists one manifest per platform by digest. A manifest lists a config and the layers by digest. The config holds the environment, the command and the hash of each unpacked layer; each layer is a gzipped tar archive of the files one Dockerfile step changed. Each level names the next by its sha256, so the digest at the top fixes every byte below it</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="540" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">ghcr.io/xmarva/perevod:0.3.1, by hand</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">every arrow is a sha256: each level names the next by the hash of its bytes</text>
<rect x="14.0" y="70.0" width="220.0" height="36.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="124.0" y="92.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">tag 0.3.1</text>
<polyline points="240.0,88.0 300.0,88.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="306.0" y="70.0" width="440.0" height="36.0" rx="9" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="526.0" y="92.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">index  sha256:8b46a084770cc8cd…</text>
<polyline points="420.0,108.0 420.0,128.0" fill="none" stroke="#6A55D8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-att)"/>
<polyline points="640.0,108.0 640.0,128.0" fill="none" stroke="#6A55D8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-att)"/>
<rect x="306.0" y="132.0" width="228.0" height="34.0" rx="9" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="420.0" y="153.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">amd64  7e0587fe56…</text>
<rect x="540.0" y="132.0" width="206.0" height="34.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="643.0" y="153.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">arm64  6ebee0b71c…</text>
<polyline points="330.0,168.0 330.0,188.0 190.0,188.0 190.0,198.0" fill="none" stroke="#6A55D8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-att)"/>
<polyline points="470.0,168.0 470.0,198.0" fill="none" stroke="#6A55D8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-att)"/>
<rect x="14.0" y="202.0" width="300.0" height="70.0" rx="9" fill="#E1F3F0" stroke="#0F8C7E" stroke-width="1.5"/>
<text x="28.0" y="226.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">config  86b33887c4…</text>
<text x="28.0" y="248.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">environment, user, command,</text>
<text x="28.0" y="264.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">the hash of each unpacked layer</text>
<text x="28.0" y="300.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">from this image&#x27;s config:</text>
<text x="28.0" y="324.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">User  perevod</text>
<text x="28.0" y="346.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">Cmd   perevod-server …</text>
<text x="28.0" y="368.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">Env   PYTHON_VERSION=3.12.16</text>
<text x="28.0" y="390.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">Env   HF_HUB_CACHE=/home/perevod/models</text>
<text x="28.0" y="412.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">Env   HF_HUB_OFFLINE=1</text>
<text x="330.0" y="216.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">layers: gzipped tar archives, one per step</text>
<rect x="330.0" y="230.0" width="11.5" height="14.0" rx="2" fill="#FCF0DA"/>
<text x="500.0" y="241.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">30 MB</text>
<text x="510.0" y="241.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575"># debian.sh --arch &#x27;amd64&#x27; out/ &#x27;</text>
<rect x="330.0" y="253.0" width="3.0" height="14.0" rx="2" fill="#FCF0DA"/>
<text x="500.0" y="264.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">2 MB</text>
<text x="510.0" y="264.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">set -eux; apt-get update; apt-get</text>
<rect x="330.0" y="276.0" width="4.7" height="14.0" rx="2" fill="#FCF0DA"/>
<text x="500.0" y="287.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">12 MB</text>
<text x="510.0" y="287.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">set -eux; savedAptMark=&quot;$(apt-mar</text>
<rect x="330.0" y="299.0" width="3.0" height="14.0" rx="2" fill="#FCF0DA"/>
<text x="500.0" y="310.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">254 B</text>
<text x="510.0" y="310.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">set -eux; for src in idle3 pip3 p</text>
<rect x="330.0" y="322.0" width="3.0" height="14.0" rx="2" fill="#C27A0E"/>
<text x="500.0" y="333.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">3 kB</text>
<text x="510.0" y="333.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">useradd --uid 1000 --create-home </text>
<rect x="330.0" y="345.0" width="3.0" height="14.0" rx="2" fill="#C27A0E"/>
<text x="500.0" y="356.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">32 B</text>
<text x="510.0" y="356.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">WORKDIR /home/perevod</text>
<rect x="330.0" y="368.0" width="3.0" height="14.0" rx="2" fill="#C27A0E"/>
<text x="500.0" y="379.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">23 kB</text>
<text x="510.0" y="379.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">COPY requirements.lock build.lock</text>
<rect x="330.0" y="391.0" width="110.0" height="14.0" rx="2" fill="#C27A0E"/>
<text x="500.0" y="402.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">285 MB</text>
<text x="510.0" y="402.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">pip install --require-hashes --no</text>
<rect x="330.0" y="414.0" width="3.0" height="14.0" rx="2" fill="#C27A0E"/>
<text x="500.0" y="425.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">2 kB</text>
<text x="510.0" y="425.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">COPY pyproject.toml README.md ./s</text>
<rect x="330.0" y="437.0" width="3.0" height="14.0" rx="2" fill="#C27A0E"/>
<text x="500.0" y="448.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">9 kB</text>
<text x="510.0" y="448.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">COPY src ./src/src</text>
<rect x="330.0" y="460.0" width="3.0" height="14.0" rx="2" fill="#C27A0E"/>
<text x="500.0" y="471.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">94 kB</text>
<text x="510.0" y="471.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">pip install --no-deps --no-build-</text>
<rect x="330.0" y="483.0" width="13.8" height="14.0" rx="2" fill="#C27A0E"/>
<text x="500.0" y="494.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">36 MB</text>
<text x="510.0" y="494.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">python -c &quot;from perevod import Tr</text>
<text x="330.0" y="518.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">the four pale ones are python:3.12-slim</text>
</svg>