<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Multi-head attention: the 256 numbers of every position are split into 4 heads of 64; each head runs attention on its own slice, and the results are concatenated and mixed by W^O">
<title>Multi-head attention: the 256 numbers of every position are split into 4 heads of 64; each head runs attention on its own slice, and the results are concatenated and mixed by W^O</title>
