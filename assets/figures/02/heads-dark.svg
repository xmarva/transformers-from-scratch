<text x="320.0" y="257.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">W^O: mix the heads</text>
<text x="14.0" y="290.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">One matrix multiplication computes all heads&#x27; queries at once; the split is only a reshape.</text>
