<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img" aria-label="Scaled dot-product attention: queries Q times transposed keys give a score for every pair of positions; the scores are divided by the square root of d_k, the mask is added, softmax turns every row into weights that sum to 1, and the weights mix the values V into the output">
