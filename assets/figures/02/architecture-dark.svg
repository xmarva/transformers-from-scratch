<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" role="img" aria-label="The encoder–decoder Transformer. The encoder (left, 3 layers) embeds the English tokens, adds positional encodings and applies self-attention and a feed-forward network, each followed by add &amp; norm. The decoder (right, 3 layers) embeds the Russian tokens shifted right and applies masked self-attention, cross-attention to the encoder&#x27;s output and a feed-forward network. The output is multiplied by the transposed embedding matrix and passed through softmax">
<title>The encoder–decoder Transformer. The encoder (left, 3 layers) embeds the English tokens, adds positional encodings and applies self-attention and a feed-forward network, each followed by add &amp; norm. The decoder (right, 3 layers) embeds the Russian tokens shifted right and applies masked self-attention, cross-attention to the encoder&#x27;s output and a feed-forward network. The output is multiplied by the transposed embedding matrix and passed through softmax</title>
