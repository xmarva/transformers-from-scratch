<text x="334.2" y="231.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">,</text>
<rect x="361.0" y="210.0" width="41.4" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="370.0" y="231.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">что</text>
<rect x="412.4" y="210.0" width="103.8" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="421.4" y="231.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">вымотал</text>
<text x="476.0" y="231.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#A82D42">а</text>
<text x="483.8" y="231.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">сь.</text>
