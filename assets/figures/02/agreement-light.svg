<polyline points="341.3,94.0 464.3,208.0" fill="none" stroke="#6A55D8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="14.0" y="280.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">violet: “she” decides these endings · dashed: word alignment</text>
