<text x="14.0" y="82.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">English</text>
<text x="14.0" y="232.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">Russian</text>
<rect x="110.0" y="60.0" width="41.4" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="130.7" y="80.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">The</text>
<rect x="159.4" y="60.0" width="96.0" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="207.4" y="80.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">researcher</text>
<rect x="263.4" y="60.0" width="49.2" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="288.0" y="80.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">said</text>
<rect x="320.6" y="60.0" width="41.4" height="32.0" rx="7" fill="#6A55D8" stroke="#6A55D8" stroke-width="1.5"/>
<text x="341.3" y="80.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">she</text>
<rect x="370.0" y="60.0" width="41.4" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="390.7" y="80.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">was</text>
<rect x="419.4" y="60.0" width="96.0" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="467.4" y="80.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">exhausted.</text>
<rect x="110.0" y="210.0" width="150.6" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="119.0" y="231.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430">Исследователь</text>
<text x="220.4" y="231.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#A82D42">ница</text>
<rect x="270.6" y="210.0" width="80.4" height="32.0" rx="7" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
