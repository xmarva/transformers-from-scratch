<rect x="106.0" y="156.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="140.0" y="156.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="174.0" y="156.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="208.0" y="156.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="242.0" y="156.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="72.0" y="190.0" width="30.0" height="30.0" rx="1" fill="#12302C"/>
<rect x="106.0" y="190.0" width="30.0" height="30.0" rx="1" fill="#12302C"/>
<rect x="140.0" y="190.0" width="30.0" height="30.0" rx="1" fill="#12302C"/>
