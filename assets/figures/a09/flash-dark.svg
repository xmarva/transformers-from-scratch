<rect x="208.0" y="190.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="242.0" y="190.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="72.0" y="224.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="106.0" y="224.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="140.0" y="224.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="174.0" y="224.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="208.0" y="224.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="242.0" y="224.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="72.0" y="258.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="106.0" y="258.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="140.0" y="258.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="174.0" y="258.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="208.0" y="258.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="242.0" y="258.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<text x="284.0" y="210.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">← the block in work</text>
<rect x="40.0" y="308.0" width="12.0" height="12.0" rx="1" fill="#12302C"/>
<text x="60.0" y="318.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">folded in</text>
<rect x="190.0" y="308.0" width="12.0" height="12.0" rx="1" fill="#9C8CF5"/>
<text x="210.0" y="318.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">in work</text>
<rect x="40.0" y="330.0" width="12.0" height="12.0" rx="1" fill="#362A14"/>
<text x="60.0" y="340.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">other rows</text>
<rect x="190.0" y="330.0" width="12.0" height="12.0" rx="1" fill="#20262E"/>
<text x="210.0" y="340.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">never read</text>
<text x="410.0" y="96.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">for each tile of keys and values:</text>
<rect x="410.0" y="116.0" width="336.0" height="26.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="420.0" y="134.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">scores = Q·Kᵀ / √d</text>
<text x="420.0" y="158.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">a 128 × 128 tile, not n × n</text>
<rect x="410.0" y="166.0" width="336.0" height="26.0" rx="9" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="420.0" y="184.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">m = max(m, row max)</text>
<text x="420.0" y="208.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">the running maximum of each row</text>
<rect x="410.0" y="216.0" width="336.0" height="26.0" rx="9" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="420.0" y="234.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">ℓ = ℓ·e^(m_old − m) + Σ e^(s − m)</text>
<text x="420.0" y="258.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">the running sum, rescaled</text>
<rect x="410.0" y="266.0" width="336.0" height="26.0" rx="9" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="420.0" y="284.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">O = O·e^(m_old − m) + e^(s − m)·V</text>
<text x="420.0" y="308.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">the running output, rescaled</text>
<text x="410.0" y="336.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">after the last tile, O / ℓ = softmax(QKᵀ/√d)·V</text>
</svg>