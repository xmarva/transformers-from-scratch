<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="How FlashAttention walks the attention matrix of a causal model. The queries are cut into blocks of rows and the keys and values into blocks of columns. For one block of queries the kernel loads one block of keys and values at a time into the GPU&#x27;s fast on-chip memory, computes that tile of scores, folds it into a running maximum, a running sum and a running output, and moves on; the full matrix of scores never exists. Tiles above the diagonal are skipped, because a causal model&#x27;s queries never look ahead">
<title>How FlashAttention walks the attention matrix of a causal model. The queries are cut into blocks of rows and the keys and values into blocks of columns. For one block of queries the kernel loads one block of keys and values at a time into the GPU&#x27;s fast on-chip memory, computes that tile of scores, folds it into a running maximum, a running sum and a running output, and moves on; the full matrix of scores never exists. Tiles above the diagonal are skipped, because a causal model&#x27;s queries never look ahead</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="360" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">FlashAttention never builds the matrix of scores</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">one block of queries against one block of keys at a time, in on-chip memory</text>
<text x="172.0" y="76.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">keys and values, in blocks</text>
<text x="58.0" y="90.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2" transform="rotate(-90 58.0 90.0)">queries, in blocks</text>
<rect x="72.0" y="88.0" width="30.0" height="30.0" rx="1" fill="#362A14"/>
<rect x="106.0" y="88.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="140.0" y="88.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="174.0" y="88.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="208.0" y="88.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
<rect x="242.0" y="88.0" width="30.0" height="30.0" rx="1" fill="#20262E"/>
