<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="One training step: a batch of sentence pairs goes through the Transformer, the scores are compared with the targets by cross-entropy with label smoothing, the loss is backpropagated into gradients, the gradient norm is clipped, and Adam updates the weights with the learning rate from the schedule; then the next batch">
<title>One training step: a batch of sentence pairs goes through the Transformer, the scores are compared with the targets by cross-entropy with label smoothing, the loss is backpropagated into gradients, the gradient norm is clipped, and Adam updates the weights with the learning rate from the schedule; then the next batch</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="300" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">One training step, repeated thousands of times</text>
<rect x="44.0" y="76.0" width="170.0" height="40.0" rx="9" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="129.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">batch of pairs</text>
<rect x="300.0" y="76.0" width="170.0" height="40.0" rx="9" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="385.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">Transformer</text>
<rect x="556.0" y="76.0" width="170.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="641.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">loss</text>
<rect x="556.0" y="196.0" width="170.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="641.0" y="220.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">backward: gradients</text>
<rect x="300.0" y="196.0" width="170.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="385.0" y="220.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">clip the gradients</text>
<rect x="44.0" y="196.0" width="170.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="129.0" y="220.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">Adam step</text>
<polyline points="216.0,96.0 296.0,96.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="472.0,96.0 552.0,96.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="641.0,118.0 641.0,192.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="554.0,216.0 474.0,216.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="298.0,216.0 218.0,216.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="169.0,194.0 330.0,120.0" fill="none" stroke="#C27A0E" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<text x="385.0" y="66.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">scores for every token</text>
<text x="641.0" y="66.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">cross-entropy, smoothed</text>
<text x="129.0" y="256.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">learning rate from the schedule</text>
<text x="385.0" y="256.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">no single step too large</text>
<text x="641.0" y="256.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">in float16, scaled up</text>
<text x="195.0" y="160.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">new weights</text>
<text x="14.0" y="286.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">Sections 3 to 6 build the parts; section 7 runs the loop.</text>
</svg>