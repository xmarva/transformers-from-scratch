<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="opus-mt-en-ru translating &#x27;The researcher said she was exhausted.&#x27; one token at a time. At every step the model gives a probability to every possible next token; four steps are shown with their top four candidates. At the verb, ▁сказал gets 0.52 and ▁сказала 0.20. The decoder takes the most probable token each time and writes: Исследователь сказал, что она устала.">
