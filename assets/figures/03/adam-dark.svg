<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Adam&#x27;s update for one weight: the gradient g feeds two running averages, m of the gradient (its direction, smoothed) and v of its square (its typical size); both are corrected for starting at zero, and the weight moves by the learning rate times m-hat divided by the square root of v-hat">
<title>Adam&#x27;s update for one weight: the gradient g feeds two running averages, m of the gradient (its direction, smoothed) and v of its square (its typical size); both are corrected for starting at zero, and the weight moves by the learning rate times m-hat divided by the square root of v-hat</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="300" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">Adam, for every weight separately</text>
<rect x="14.0" y="120.0" width="110.0" height="44.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="69.0" y="146.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">gradient g</text>
<rect x="190.0" y="70.0" width="210.0" height="44.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="295.0" y="96.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">m ← β₁m + (1−β₁) g</text>
<rect x="190.0" y="170.0" width="210.0" height="44.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="295.0" y="196.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">v ← β₂v + (1−β₂) g²</text>
<rect x="460.0" y="120.0" width="150.0" height="44.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="535.0" y="146.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">step = η m̂ / √v̂</text>
<rect x="650.0" y="120.0" width="96.0" height="44.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="698.0" y="146.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">θ ← θ − step</text>
<polyline points="126.0,136.0 186.0,94.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="126.0,148.0 186.0,190.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="402.0,92.0 456.0,136.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="402.0,192.0 456.0,150.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="612.0,142.0 646.0,142.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="190.0" y="62.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">direction: the gradient, averaged over recent steps</text>
<text x="190.0" y="234.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">size: √v is the gradient&#x27;s typical magnitude</text>
<text x="460.0" y="186.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">m̂, v̂: corrected for starting at 0</text>
<text x="14.0" y="274.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">Dividing by √v̂ makes every weight&#x27;s step at most about η, whether its gradients are large or tiny.</text>
</svg>