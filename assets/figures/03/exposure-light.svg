<text x="325.5" y="97.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">Исследовательница</text>
<rect x="405.8" y="78.0" width="70.7" height="30.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="441.2" y="97.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">сказала</text>
<rect x="482.6" y="78.0" width="28.6" height="30.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="496.9" y="97.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">,</text>
<rect x="517.2" y="78.0" width="39.5" height="30.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="536.9" y="97.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">что</text>
<rect x="562.7" y="78.0" width="94.1" height="30.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
