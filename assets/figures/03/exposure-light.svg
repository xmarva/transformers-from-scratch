<rect x="662.8" y="78.0" width="28.6" height="30.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="677.1" y="97.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">.</text>
<text x="190.0" y="132.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">the reference, word by word: every next prediction starts from the right history</text>
