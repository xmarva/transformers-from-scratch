<rect x="638.1" y="176.0" width="28.6" height="30.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="652.4" y="195.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">.</text>
<text x="190.0" y="232.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">its own output: a masculine first word, and the verb agrees with the mistake</text>
<text x="14.0" y="282.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">Real output of opus-mt-en-ru, our lesson 4 baseline: Исследователь сказал, что она устала.</text>
