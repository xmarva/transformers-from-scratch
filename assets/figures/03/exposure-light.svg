<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="In training the decoder reads the reference translation, Исследовательница сказала, что вымоталась. When translating, it reads its own previous words. opus-mt-en-ru writes: Исследователь сказал, что она устала. Its first word is masculine, and the next word agrees with that mistake">
<title>In training the decoder reads the reference translation, Исследовательница сказала, что вымоталась. When translating, it reads its own previous words. opus-mt-en-ru writes: Исследователь сказал, что она устала. Its first word is masculine, and the next word agrees with that mistake</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
