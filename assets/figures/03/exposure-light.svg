<text x="457.9" y="195.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">,</text>
<rect x="478.2" y="176.0" width="39.5" height="30.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="497.9" y="195.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">что</text>
<rect x="523.7" y="176.0" width="39.5" height="30.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
