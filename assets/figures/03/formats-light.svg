<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Bit layouts: float32 has 1 sign bit, 8 exponent bits and 23 mantissa bits; bfloat16 1, 8 and 7; float16 1, 5 and 10. float16 covers a much smaller range, so tiny gradients underflow to zero unless the loss is scaled up first">
