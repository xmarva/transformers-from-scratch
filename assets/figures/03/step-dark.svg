<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="One training step: a batch of sentence pairs goes through the Transformer, the scores are compared with the targets by cross-entropy with label smoothing, the loss is backpropagated into gradients, the gradient norm is clipped, and Adam updates the weights with the learning rate from the schedule; then the next batch">
<title>One training step: a batch of sentence pairs goes through the Transformer, the scores are compared with the targets by cross-entropy with label smoothing, the loss is backpropagated into gradients, the gradient norm is clipped, and Adam updates the weights with the learning rate from the schedule; then the next batch</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="300" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">One training step, repeated thousands of times</text>
<rect x="44.0" y="76.0" width="170.0" height="40.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="129.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">batch of pairs</text>
<rect x="300.0" y="76.0" width="170.0" height="40.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="385.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">Transformer</text>
<rect x="556.0" y="76.0" width="170.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="641.0" y="100.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">loss</text>
<rect x="556.0" y="196.0" width="170.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="641.0" y="220.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">backward: gradients</text>
<rect x="300.0" y="196.0" width="170.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="385.0" y="220.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">clip the gradients</text>
<rect x="44.0" y="196.0" width="170.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="129.0" y="220.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">Adam step</text>
<polyline points="216.0,96.0 296.0,96.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="472.0,96.0 552.0,96.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="641.0,118.0 641.0,192.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="554.0,216.0 474.0,216.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="298.0,216.0 218.0,216.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="169.0,194.0 330.0,120.0" fill="none" stroke="#F0B04A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<text x="385.0" y="66.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">scores for every token</text>
<text x="641.0" y="66.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">cross-entropy, smoothed</text>
<text x="129.0" y="256.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">learning rate from the schedule</text>
<text x="385.0" y="256.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">no single step too large</text>
<text x="641.0" y="256.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">in float16, scaled up</text>
<text x="195.0" y="160.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">new weights</text>
<text x="14.0" y="286.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">Sections 3 to 6 build the parts; section 7 runs the loop.</text>
</svg>