<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="A toy model. Greedy decoding takes the most likely first token, A, then its best continuation, x: probability 0.20. Beam search keeps the two best first tokens and finds B then z, probability 0.36">
<title>A toy model. Greedy decoding takes the most likely first token, A, then its best continuation, x: probability 0.20. Beam search keeps the two best first tokens and finds B then z, probability 0.36</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="330" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">Greedy takes the best next token; beam search keeps several</text>
<rect x="22.0" y="154.0" width="36.0" height="32.0" rx="7" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="40.0" y="173.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="10" font-weight="500" fill="#E7EAF0" xml:space="preserve">&lt;bos&gt;</text>
<polyline points="60.0,170.0 200.0,92.0" fill="none" stroke="#F0B04A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="202.0" y="77.0" width="28.6" height="30.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="216.3" y="96.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">A</text>
<text x="216.0" y="70.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">0.50</text>
<polyline points="60.0,170.0 200.0,172.0" fill="none" stroke="#F0B04A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="202.0" y="157.0" width="28.6" height="30.0" rx="7" fill="#F0B04A" stroke="#F0B04A" stroke-width="1.5"/>
<text x="216.3" y="176.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">B</text>
<text x="216.0" y="150.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">0.40</text>
<polyline points="60.0,170.0 200.0,252.0" fill="none" stroke="#9AA3B2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="202.0" y="237.0" width="28.6" height="30.0" rx="7" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="216.3" y="256.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">C</text>
<text x="216.0" y="230.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">0.10</text>
<polyline points="244.0,92.0 400.0,66.0" fill="none" stroke="#9AA3B2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="402.0" y="53.0" width="28.6" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="416.3" y="70.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">x</text>
<text x="450.0" y="71.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">0.50 × 0.40 = 0.20</text>
<text x="620.0" y="71.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">← greedy</text>
<polyline points="244.0,92.0 400.0,92.0" fill="none" stroke="#9AA3B2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="402.0" y="79.0" width="28.6" height="26.0" rx="7" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="416.3" y="96.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">y</text>
<text x="450.0" y="97.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">0.50 × 0.35 = 0.17</text>
<polyline points="244.0,92.0 400.0,118.0" fill="none" stroke="#9AA3B2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="402.0" y="105.0" width="28.6" height="26.0" rx="7" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="416.3" y="122.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">z</text>
<text x="450.0" y="123.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">0.50 × 0.25 = 0.12</text>
<polyline points="244.0,172.0 400.0,168.0" fill="none" stroke="#9AA3B2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="402.0" y="155.0" width="28.6" height="26.0" rx="7" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="416.3" y="172.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">x</text>
<text x="450.0" y="173.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">0.40 × 0.05 = 0.02</text>
<polyline points="244.0,172.0 400.0,194.0" fill="none" stroke="#9AA3B2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="402.0" y="181.0" width="28.6" height="26.0" rx="7" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="416.3" y="198.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">y</text>
<text x="450.0" y="199.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#9AA3B2">0.40 × 0.05 = 0.02</text>
<polyline points="244.0,172.0 400.0,220.0" fill="none" stroke="#F0B04A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="402.0" y="207.0" width="28.6" height="26.0" rx="7" fill="#F0B04A" stroke="#F0B04A" stroke-width="1.5"/>
<text x="416.3" y="224.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">z</text>
<text x="450.0" y="225.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#F6C878">0.40 × 0.90 = 0.36</text>
<text x="620.0" y="225.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">← beam of 2</text>
<text x="202.0" y="290.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">greedy: A, then x, probability 0.20</text>
<text x="202.0" y="312.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">beam search: B, then z, probability 0.36</text>
</svg>