<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="What an encoder–decoder costs against a decoder-only model. The decoder-only model is one stack with P parameters, and every token, of the input and of the output, passes through it. The encoder–decoder has two stacks of P parameters each: input tokens pass through the encoder, output tokens through the decoder. Each token meets P parameters in both cases, so the compute is about the same, but the encoder–decoder has to keep twice the parameters in memory">
<title>What an encoder–decoder costs against a decoder-only model. The decoder-only model is one stack with P parameters, and every token, of the input and of the output, passes through it. The encoder–decoder has two stacks of P parameters each: input tokens pass through the encoder, output tokens through the decoder. Each token meets P parameters in both cases, so the compute is about the same, but the encoder–decoder has to keep twice the parameters in memory</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="330" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">The same work per token, twice the weights</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">every token passes through one stack of P parameters, in either design</text>
<text x="14.0" y="86.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">decoder-only: P parameters</text>
<rect x="14.0" y="98.0" width="66.4" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="47.2" y="114.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#F6C878" xml:space="preserve">question</text>
<rect x="85.4" y="98.0" width="53.2" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="112.1" y="114.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#F6C878" xml:space="preserve">schema</text>
<rect x="143.7" y="98.0" width="53.2" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="170.3" y="114.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#F6C878" xml:space="preserve">SELECT</text>
<rect x="201.9" y="98.0" width="24.2" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="214.0" y="114.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#F6C878" xml:space="preserve">…</text>
<rect x="14.0" y="140.0" width="300.0" height="70.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="164.0" y="179.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">one stack, P</text>
<polyline points="164.0,125.0 164.0,139.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="14.0" y="236.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">input and output tokens both pass through P</text>
<text x="14.0" y="256.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">memory: P</text>
<text x="400.0" y="86.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">encoder–decoder: 2P parameters</text>
<rect x="400.0" y="98.0" width="66.4" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="433.2" y="114.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#F6C878" xml:space="preserve">question</text>
<rect x="471.4" y="98.0" width="53.2" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="498.1" y="114.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#F6C878" xml:space="preserve">schema</text>
<rect x="590.0" y="98.0" width="53.2" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="616.6" y="114.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#F6C878" xml:space="preserve">SELECT</text>
<rect x="648.2" y="98.0" width="24.2" height="26.0" rx="7" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="660.3" y="114.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#F6C878" xml:space="preserve">…</text>
<rect x="400.0" y="140.0" width="160.0" height="70.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="480.0" y="179.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">encoder, P</text>
<rect x="586.0" y="140.0" width="160.0" height="70.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="666.0" y="179.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">decoder, P</text>
<polyline points="470.0,125.0 470.0,139.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="640.0,125.0 640.0,139.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="561.0,175.0 585.0,175.0" fill="none" stroke="#9C8CF5" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-att)"/>
<text x="400.0" y="236.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">input tokens through the encoder, output tokens</text>
<text x="400.0" y="256.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">through the decoder: each still meets P</text>
<text x="400.0" y="276.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">memory: 2P</text>
<text x="14.0" y="312.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">compute per token: the same; weights to hold: twice as many (Wang et al., 2022)</text>
</svg>