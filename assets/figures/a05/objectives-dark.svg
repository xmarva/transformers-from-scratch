<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" role="img" aria-label="Two ways to pre-train an encoder–decoder on raw text. T5&#x27;s span corruption replaces spans of the sentence with sentinel tokens, extra_id_0 and extra_id_1, and the target lists only the dropped spans, each after its sentinel, so the target is short. BART&#x27;s text infilling replaces each span with a single mask token, which can stand for any number of words, and the target is the whole original sentence">
<title>Two ways to pre-train an encoder–decoder on raw text. T5&#x27;s span corruption replaces spans of the sentence with sentinel tokens, extra_id_0 and extra_id_1, and the target lists only the dropped spans, each after its sentinel, so the target is short. BART&#x27;s text infilling replaces each span with a single mask token, which can stand for any number of words, and the target is the whole original sentence</title>
