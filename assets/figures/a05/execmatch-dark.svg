<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-label="Two ways to grade a predicted query, on an illustrative table of four people aged 41, 29, 35 and 52. The reference is AGE greater than 34. A prediction of AGE at least 35 is a different string, so exact matching calls it wrong, but it returns the same three people and is right. A prediction of AGE greater than 30 also returns the same three people on this table, so execution calls it right although it is wrong; a second table with a person aged 32 tells the two apart, which is what a test suite does">
<title>Two ways to grade a predicted query, on an illustrative table of four people aged 41, 29, 35 and 52. The reference is AGE greater than 34. A prediction of AGE at least 35 is a different string, so exact matching calls it wrong, but it returns the same three people and is right. A prediction of AGE greater than 30 also returns the same three people on this table, so execution calls it right although it is wrong; a second table with a person aged 32 tells the two apart, which is what a test suite does</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="372" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">Grading a query: compare the text, or run it</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">an illustration: the question is &quot;Who is older than 34?&quot; and the table has four people</text>
<text x="14.0" y="86.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">People</text>
<rect x="14.0" y="98.0" width="92.0" height="30.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="60.0" y="117.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">Ana</text>
<rect x="110.0" y="98.0" width="52.0" height="30.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="136.0" y="117.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">41</text>
<rect x="14.0" y="134.0" width="92.0" height="30.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="60.0" y="153.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">Ben</text>
<rect x="110.0" y="134.0" width="52.0" height="30.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="136.0" y="153.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">29</text>
<rect x="14.0" y="170.0" width="92.0" height="30.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="60.0" y="189.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">Chen</text>
<rect x="110.0" y="170.0" width="52.0" height="30.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="136.0" y="189.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">35</text>
<rect x="14.0" y="206.0" width="92.0" height="30.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="60.0" y="225.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">Dana</text>
<rect x="110.0" y="206.0" width="52.0" height="30.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="136.0" y="225.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">52</text>
<text x="196.0" y="86.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">WHERE …</text>
<text x="330.0" y="86.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">exact match</text>
<text x="468.0" y="86.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">rows it returns</text>
<text x="640.0" y="86.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">execution</text>
<text x="196.0" y="110.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">reference</text>
<rect x="196.0" y="116.0" width="120.0" height="28.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="256.0" y="134.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">AGE &gt; 34</text>
<text x="468.0" y="135.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">Ana, Chen, Dana</text>
<text x="196.0" y="162.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">prediction 1</text>
<rect x="196.0" y="168.0" width="120.0" height="28.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="256.0" y="186.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">AGE &gt;= 35</text>
<text x="330.0" y="187.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">✗ different text</text>
<text x="640.0" y="187.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">✓ right</text>
<text x="468.0" y="187.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">Ana, Chen, Dana</text>
<text x="196.0" y="214.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">prediction 2</text>
<rect x="196.0" y="220.0" width="120.0" height="28.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="256.0" y="238.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">AGE &gt; 30</text>
<text x="330.0" y="239.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">✗ different text</text>
<text x="640.0" y="239.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">✓ but wrong</text>
<text x="468.0" y="239.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">Ana, Chen, Dana</text>
<text x="14.0" y="286.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">prediction 1 is the same query written differently: exact match is too strict</text>
<text x="14.0" y="308.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">prediction 2 only agrees on this table: add Eli, aged 32, and the rows differ</text>
<text x="14.0" y="330.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">Spider&#x27;s official metric runs every query on a suite of such tables</text>
</svg>