<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" width="760" height="326" role="img" aria-label="Four encoders after BERT, each with the one thing it changed: RoBERTa in 2019 the training recipe, ELECTRA in 2020 the training task, DeBERTa in 2020 the attention, ModernBERT in 2024 the whole block">
<title>Four encoders after BERT, each with the one thing it changed: RoBERTa in 2019 the training recipe, ELECTRA in 2020 the training task, DeBERTa in 2020 the attention, ModernBERT in 2024 the whole block</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="326" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">Seven years of encoders, one change at a time</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">each model kept most of what came before and changed one thing</text>
<rect x="14.0" y="70.0" width="130.0" height="34.0" rx="9" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="79.0" y="91.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">BERT</text>
<text x="158.0" y="91.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">2018</text>
<text x="200.0" y="91.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">Google</text>
<text x="344.0" y="91.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">the start: masked LM, post-norm, learned positions</text>
<polyline points="79.0,105.0 79.0,113.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="114.0" width="130.0" height="34.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="79.0" y="135.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">RoBERTa</text>
<text x="158.0" y="135.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">2019</text>
<text x="200.0" y="135.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">Facebook AI</text>
<text x="344.0" y="135.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">the recipe: more data, big batches, no NSP game</text>
<polyline points="79.0,149.0 79.0,157.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="158.0" width="130.0" height="34.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="79.0" y="179.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">ELECTRA</text>
<text x="158.0" y="179.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">2020</text>
<text x="200.0" y="179.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">Stanford, Google</text>
<text x="344.0" y="179.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">the task: spot replaced tokens, learn from all</text>
<polyline points="79.0,193.0 79.0,201.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="202.0" width="130.0" height="34.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="79.0" y="223.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">DeBERTa</text>
<text x="158.0" y="223.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">2020</text>
<text x="200.0" y="223.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">Microsoft</text>
<text x="344.0" y="223.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">the attention: content and position kept apart</text>
<polyline points="79.0,237.0 79.0,245.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="246.0" width="130.0" height="34.0" rx="9" fill="#F2667C" stroke="#F2667C" stroke-width="1.5"/>
<text x="79.0" y="267.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">ModernBERT</text>
<text x="158.0" y="267.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">2024</text>
<text x="200.0" y="267.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">Answer.AI, LightOn</text>
<text x="344.0" y="267.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">the block: RoPE, GeGLU, local and global layers</text>
</svg>