<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="Four kinds of tests for a model package. Tests of the config and glue need no model and run in milliseconds. Invariant tests need only a tiny random model. Golden tests run the published model on a dozen sentences and catch any change in its output. A quality floor scores the model on a test set and catches a model that got worse on average">
<title>Four kinds of tests for a model package. Tests of the config and glue need no model and run in milliseconds. Invariant tests need only a tiny random model. Golden tests run the published model on a dozen sentences and catch any change in its output. A quality floor scores the model on a test set and catches a model that got worse on average</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="352" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">Four kinds of tests, 20 tests in perevod</text>
<text x="214.0" y="62.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">needs</text>
<text x="410.0" y="62.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">catches</text>
<rect x="14.0" y="76.0" width="186.0" height="50.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="107.0" y="105.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">config and glue</text>
<text x="214.0" y="98.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">no model</text>
<text x="214.0" y="118.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">milliseconds</text>
<text x="410.0" y="106.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">a typo in a key, an empty input, a lost line</text>
<rect x="14.0" y="140.0" width="186.0" height="50.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="107.0" y="169.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">invariants</text>
<text x="214.0" y="162.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">a tiny random model</text>
<text x="214.0" y="182.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">milliseconds</text>
<text x="410.0" y="170.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">a leaking mask, padding that matters</text>
<rect x="14.0" y="204.0" width="186.0" height="50.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="107.0" y="233.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">golden translations</text>
<text x="214.0" y="226.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">the published model</text>
<text x="214.0" y="246.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">seconds</text>
<text x="410.0" y="234.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">any change in what the model writes</text>
<rect x="14.0" y="268.0" width="186.0" height="50.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="107.0" y="297.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">a quality floor</text>
<text x="214.0" y="290.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">the model and a test set</text>
<text x="214.0" y="310.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">a minute</text>
<text x="410.0" y="298.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">a model that got worse on average</text>
<text x="14.0" y="338.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">Down the list: slower, more expensive, closer to what users see.</text>
</svg>