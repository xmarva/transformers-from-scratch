<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="A model card on the Hugging Face Hub has two parts. A YAML header that machines read: language, license, datasets, tags, and model-index with the metrics, which the Hub shows as an evaluation table. And a text for people: what the model is, what it is for and not for, the data, the evaluation and the limitations, following Mitchell et al. (2019)">
