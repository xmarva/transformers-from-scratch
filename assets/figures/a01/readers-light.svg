<rect x="332.1" y="152.0" width="55.1" height="30.0" rx="7" fill="#FBE6EA" stroke="#D23F57" stroke-width="1.5"/>
<text x="359.6" y="171.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#A82D42" xml:space="preserve">river</text>
