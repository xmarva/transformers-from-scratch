<text x="150.0" y="202.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">one model reads each way; the two halves meet only at the output</text>
<text x="14.0" y="252.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#1D2430">BERT</text>
<rect x="150.0" y="232.0" width="39.5" height="30.0" rx="7" fill="#E1F3F0" stroke="#0F8C7E" stroke-width="1.5"/>
