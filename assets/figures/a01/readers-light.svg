<text x="375.2" y="251.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#0B6B60" xml:space="preserve">river</text>
<rect x="408.8" y="232.0" width="39.5" height="30.0" rx="7" fill="#E1F3F0" stroke="#0F8C7E" stroke-width="1.5"/>
<text x="428.6" y="251.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#0B6B60" xml:space="preserve">was</text>
