<text x="219.2" y="91.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">bank</text>
<rect x="248.8" y="72.0" width="31.7" height="30.0" rx="7" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="264.7" y="91.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">of</text>
<rect x="286.6" y="72.0" width="39.5" height="30.0" rx="7" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="306.3" y="91.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">the</text>
<rect x="332.1" y="72.0" width="55.1" height="30.0" rx="7" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="359.6" y="91.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">river</text>
<rect x="393.2" y="72.0" width="39.5" height="30.0" rx="7" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="413.0" y="91.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">was</text>
