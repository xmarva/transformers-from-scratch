<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Three ways to learn from raw text, predicting the word bank in the bank of the river was steep. GPT predicts each word from the words before it and sees only the. ELMo trains a left-to-right and a right-to-left model separately and joins their outputs. BERT hides the word behind a mask and predicts it from both sides at once, in every layer">
<title>Three ways to learn from raw text, predicting the word bank in the bank of the river was steep. GPT predicts each word from the words before it and sees only the. ELMo trains a left-to-right and a right-to-left model separately and joins their outputs. BERT hides the word behind a mask and predicts it from both sides at once, in every layer</title>
<defs>
