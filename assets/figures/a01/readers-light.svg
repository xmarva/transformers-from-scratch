<text x="481.9" y="251.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#0B6B60" xml:space="preserve">steep</text>
<text x="150.0" y="282.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">the word is hidden, and every layer reads both sides of the gap</text>
<text x="14.0" y="330.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">ELMo: teal is its left-to-right model, rose its right-to-left one</text>
