<text x="466.3" y="91.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">steep</text>
<text x="150.0" y="122.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">left to right only: the word that decides the meaning comes too late</text>
