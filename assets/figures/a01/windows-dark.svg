<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="A document of 1,100 tokens cut into 3 overlapping windows of 510 tokens with a stride of 384. Each token&#x27;s label is taken from the window where it is furthest from the window&#x27;s edge, so every token is judged with context on both sides">
<title>A document of 1,100 tokens cut into 3 overlapping windows of 510 tokens with a stride of 384. Each token&#x27;s label is taken from the window where it is furthest from the window&#x27;s edge, so every token is judged with context on both sides</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="290" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">A 1,100-token document, read in windows of 510</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">a window starts every 384 tokens; a token keeps the prediction of the window it sits deepest in</text>
<rect x="20.0" y="72.0" width="333.8" height="30.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="186.9" y="91.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">window 1: tokens 0–509</text>
<rect x="271.3" y="112.0" width="333.8" height="30.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="438.3" y="131.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">window 2: tokens 384–893</text>
<rect x="406.2" y="152.0" width="333.8" height="30.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="573.1" y="171.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">window 3: tokens 590–1099</text>
<text x="14.0" y="206.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">whose prediction each token keeps</text>
<rect x="20.0" y="216.0" width="292.6" height="22.0" rx="1" fill="#12302C"/>
<rect x="312.6" y="216.0" width="193.1" height="22.0" rx="1" fill="#272144"/>
<rect x="505.7" y="216.0" width="234.3" height="22.0" rx="1" fill="#391D24"/>
<text x="166.3" y="262.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">0–446</text>
<text x="409.1" y="262.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">447–741</text>
<text x="622.8" y="262.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">742–1099</text>
</svg>