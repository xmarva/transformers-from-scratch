<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="One BERT layer: self-attention, dropout, add the input, LayerNorm; then a feed-forward network 768 to 3072 to 768 with GELU, dropout, add, LayerNorm. The norm sits after each addition, on the main path">
<title>One BERT layer: self-attention, dropout, add the input, LayerNorm; then a feed-forward network 768 to 3072 to 768 with GELU, dropout, add, LayerNorm. The norm sits after each addition, on the main path</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="420" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">One of BERT&#x27;s twelve layers</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">post-norm, as in the 2017 Transformer: LayerNorm after each addition</text>
<rect x="14.0" y="72.0" width="360.0" height="34.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="194.0" y="93.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">x, 768 numbers per token</text>
<polyline points="194.0,107.0 194.0,120.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="122.0" width="360.0" height="34.0" rx="9" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="194.0" y="143.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">self-attention, 12 heads, no causal mask</text>
<polyline points="194.0,157.0 194.0,170.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="172.0" width="360.0" height="34.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="194.0" y="193.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">dropout, add x</text>
<polyline points="194.0,207.0 194.0,220.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="222.0" width="360.0" height="34.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="194.0" y="243.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">LayerNorm</text>
<polyline points="194.0,257.0 194.0,270.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="272.0" width="360.0" height="34.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="194.0" y="293.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#7FDCCF" xml:space="preserve">feed-forward 768 → 3072 → 768, GELU</text>
<polyline points="194.0,307.0 194.0,320.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="322.0" width="360.0" height="34.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="194.0" y="343.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">dropout, add</text>
<polyline points="194.0,357.0 194.0,370.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="372.0" width="360.0" height="34.0" rx="9" fill="#391D24" stroke="#F2667C" stroke-width="1.5"/>
<text x="194.0" y="393.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F7A1AE" xml:space="preserve">LayerNorm</text>
<polyline points="376.0,89.0 392.0,89.0 392.0,189.0 378.0,189.0" fill="none" stroke="#F0B04A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<polyline points="376.0,239.0 404.0,239.0 404.0,339.0 378.0,339.0" fill="none" stroke="#F0B04A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<text x="440.0" y="120.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">the residual path: x is added back</text>
<text x="440.0" y="140.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">after attention and after the</text>
<text x="440.0" y="160.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">feed-forward network</text>
<text x="440.0" y="220.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">GELU(x) = x · Φ(x): a ReLU</text>
<text x="440.0" y="240.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">with a smooth corner</text>
<text x="440.0" y="300.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">the same layer, twelve times;</text>
<text x="440.0" y="320.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">every one has its own weights</text>
</svg>