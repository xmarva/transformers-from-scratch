<rect x="648.0" y="204.0" width="70.7" height="30.0" rx="7" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="683.4" y="223.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">|h − s|</text>
<polyline points="494.0,96.0 536.0,140.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="494.0,160.0 536.0,168.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="494.0,224.0 536.0,196.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="236.0" y="318.0" width="340.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="406.0" y="342.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">feed-forward: 6144 → 3072 → 1024 → 1</text>
<polyline points="643.0,268.0 643.0,338.0 580.0,338.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
