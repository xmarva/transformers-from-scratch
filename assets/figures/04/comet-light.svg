<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="COMET: the source sentence, the translation and the reference are each read by the same XLM-R large encoder; a weighted mix of its 25 layers is averaged over the tokens into one vector of 1024 numbers per sentence, s, h and r; six combinations of them, h, r, the products h times r and h times s and the distances between them, make 6144 features, and a small feed-forward network turns them into one score. It was trained to predict human scores of translations">
<title>COMET: the source sentence, the translation and the reference are each read by the same XLM-R large encoder; a weighted mix of its 25 layers is averaged over the tokens into one vector of 1024 numbers per sentence, s, h and r; six combinations of them, h, r, the products h times r and h times s and the distances between them, make 6144 features, and a small feed-forward network turns them into one score. It was trained to predict human scores of translations</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="380" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">COMET: three sentences, one encoder, a small regressor</text>
