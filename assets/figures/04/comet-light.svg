<text x="99.0" y="164.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">translation</text>
<polyline points="186.0,160.0 232.0,160.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="422.0" y="140.0" width="70.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="457.0" y="164.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">h</text>
<polyline points="388.0,160.0 418.0,160.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="14.0" y="204.0" width="170.0" height="40.0" rx="9" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="99.0" y="228.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#8A5508" xml:space="preserve">reference</text>
<polyline points="186.0,224.0 232.0,224.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="422.0" y="204.0" width="70.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="457.0" y="228.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">r</text>
