<rect x="648.0" y="154.0" width="70.7" height="30.0" rx="7" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="683.4" y="173.6" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">|h − r|</text>
<rect x="556.0" y="204.0" width="55.1" height="30.0" rx="7" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
