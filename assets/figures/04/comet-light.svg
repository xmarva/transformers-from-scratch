<rect x="236.0" y="70.0" width="150.0" height="180.0" rx="9" fill="#E1F3F0" stroke="#0F8C7E" stroke-width="1.5"/>
<text x="311.0" y="150.0" text-anchor="middle" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#0F8C7E">XLM-R large</text>
<text x="311.0" y="172.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">24 layers</text>
<text x="236.0" y="270.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">one encoder, the same</text>
<text x="236.0" y="286.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">weights for all three</text>
<text x="408.0" y="270.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">1024 numbers</text>
<text x="408.0" y="286.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">per sentence</text>
<rect x="540.0" y="70.0" width="206.0" height="196.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="556.0" y="92.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">features, 6 × 1024</text>
<rect x="556.0" y="104.0" width="28.6" height="30.0" rx="7" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="570.3" y="123.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">h</text>
