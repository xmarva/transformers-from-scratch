<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="The paired bootstrap on a toy test set of 8 sentences: draw 8 sentences with replacement, so that some appear twice and others not at all, score both systems on the same draw, and record the difference; repeated a thousand times, the differences form a distribution, and the share of draws where A beats B says how sure we can be">
