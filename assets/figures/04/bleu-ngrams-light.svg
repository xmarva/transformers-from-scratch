<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="BLEU on one sentence. Our model translates &#x27;Tell Tom that I may be late.&#x27; as Скажи Тому, что я, возможно, опоздаю. The reference says Скажи Тому, что я, может быть, опоздаю. The single different word breaks n-grams of every length: 9 of 10 1-grams match, 7 of 9 2-grams match, 5 of 8 3-grams match, 3 of 7 4-grams match. With the brevity penalty 0.90, BLEU is 60">
<title>BLEU on one sentence. Our model translates &#x27;Tell Tom that I may be late.&#x27; as Скажи Тому, что я, возможно, опоздаю. The reference says Скажи Тому, что я, может быть, опоздаю. The single different word breaks n-grams of every length: 9 of 10 1-grams match, 7 of 9 2-grams match, 5 of 8 3-grams match, 3 of 7 4-grams match. With the brevity penalty 0.90, BLEU is 60</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="400" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">BLEU on one sentence: a synonym breaks n-grams of every length</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">English: Tell Tom that I may be late.</text>
<text x="14.0" y="90.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">our model</text>
<rect x="110.0" y="70.0" width="50.9" height="28.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="135.4" y="88.2" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A5508" xml:space="preserve">Скажи</text>
