<text x="227.8" y="88.2" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A5508" xml:space="preserve">,</text>
<rect x="246.0" y="70.0" width="36.5" height="28.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="264.2" y="88.2" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A5508" xml:space="preserve">что</text>
<rect x="287.4" y="70.0" width="26.4" height="28.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="300.6" y="88.2" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A5508" xml:space="preserve">я</text>
<rect x="318.8" y="70.0" width="26.4" height="28.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
<text x="332.0" y="88.2" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A5508" xml:space="preserve">,</text>
<rect x="350.2" y="70.0" width="72.5" height="28.0" rx="7" fill="#D23F57" stroke="#D23F57" stroke-width="1.5"/>
<text x="386.5" y="88.2" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#FFFFFF" xml:space="preserve">возможно</text>
<rect x="427.7" y="70.0" width="26.4" height="28.0" rx="7" fill="#FCF0DA" stroke="#C27A0E" stroke-width="1.5"/>
