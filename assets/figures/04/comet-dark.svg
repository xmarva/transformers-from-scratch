<rect x="422.0" y="140.0" width="70.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="457.0" y="164.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">h</text>
