<text x="406.0" y="342.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">feed-forward: 6144 → 3072 → 1024 → 1</text>
<polyline points="643.0,268.0 643.0,338.0 580.0,338.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
