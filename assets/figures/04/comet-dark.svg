<rect x="236.0" y="70.0" width="150.0" height="180.0" rx="9" fill="#12302C" stroke="#3CC2B0" stroke-width="1.5"/>
<text x="311.0" y="150.0" text-anchor="middle" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#3CC2B0">XLM-R large</text>
<text x="311.0" y="172.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">24 layers</text>
<text x="236.0" y="270.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">one encoder, the same</text>
<text x="236.0" y="286.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">weights for all three</text>
<text x="408.0" y="270.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">1024 numbers</text>
<text x="408.0" y="286.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">per sentence</text>
<rect x="540.0" y="70.0" width="206.0" height="196.0" rx="9" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="556.0" y="92.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">features, 6 × 1024</text>
<rect x="556.0" y="104.0" width="28.6" height="30.0" rx="7" fill="#272144" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="570.3" y="123.5" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#C4B9FF" xml:space="preserve">h</text>
