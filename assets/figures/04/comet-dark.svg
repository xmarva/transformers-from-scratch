<text x="99.0" y="228.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">reference</text>
<polyline points="186.0,224.0 232.0,224.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="422.0" y="204.0" width="70.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="457.0" y="228.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">r</text>
