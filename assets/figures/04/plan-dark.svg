<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="The plan of the lesson: the 36 385 test pairs are translated by three systems (our model with greedy decoding, our model with beam search, opus-mt-en-ru); the translations are scored by BLEU, chrF and COMET against the references; the metrics are themselves checked against professional translators&#x27; judgments and against translations broken on purpose; differences between systems get confidence intervals from the bootstrap">
