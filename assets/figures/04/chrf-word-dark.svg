<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="chrF on the word сказал against the reference сказала: for n from 1 to 6, every character n-gram of the translation is found in the reference, so precision is 1; the reference has one n-gram more at every n, the ones with its last letter, so recall falls as n grows. Averaged, precision 1.00 and recall 0.73 give chrF 78; a word-level metric sees one wrong word">
<title>chrF on the word сказал against the reference сказала: for n from 1 to 6, every character n-gram of the translation is found in the reference, so precision is 1; the reference has one n-gram more at every n, the ones with its last letter, so recall falls as n grows. Averaged, precision 1.00 and recall 0.73 give chrF 78; a word-level metric sees one wrong word</title>
