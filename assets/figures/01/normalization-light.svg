<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The letter й stored two ways: as one code point, U+0439, or as и (U+0438) followed by a combining breve (U+0306). They look the same but are different strings; NFKC normalization turns the second into the first">
<title>The letter й stored two ways: as one code point, U+0439, or as и (U+0438) followed by a combining breve (U+0306). They look the same but are different strings; NFKC normalization turns the second into the first</title>
