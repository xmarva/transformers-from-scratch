<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 252" width="560" height="252" role="img" aria-label="The BPE training loop: count adjacent symbol pairs, take the most frequent, merge it everywhere, add the new symbol to the vocabulary, and repeat until the vocabulary is full">
<title>The BPE training loop: count adjacent symbol pairs, take the most frequent, merge it everywhere, add the new symbol to the vocabulary, and repeat until the vocabulary is full</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="560" height="252" rx="12" fill="#1A1F26"/>
<text x="14.0" y="26.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">BPE training loop</text>
<rect x="36.0" y="50.0" width="220.0" height="42.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="146.0" y="75.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0">1 · count adjacent pairs</text>
<rect x="304.0" y="50.0" width="220.0" height="42.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="414.0" y="75.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0">2 · take the most frequent</text>
<rect x="304.0" y="170.0" width="220.0" height="42.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="414.0" y="195.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878">3 · merge it everywhere</text>
<rect x="36.0" y="170.0" width="220.0" height="42.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="146.0" y="195.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0">4 · add it to the vocabulary</text>
<polyline points="258.0,71.0 302.0,71.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="414.0,94.0 414.0,168.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="302.0,191.0 258.0,191.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="146.0,168.0 146.0,94.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="280.0" y="136.0" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">repeat until the vocabulary is full</text>
</svg>