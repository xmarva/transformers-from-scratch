<text x="522.5" y="110.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">BPE model</text>
<text x="522.5" y="144.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">merges, encode_word()</text>
