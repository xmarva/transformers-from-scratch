<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img" aria-label="The embedding table has one row per token in the vocabulary and d_model columns. A token&#x27;s id selects its row, a vector of d_model numbers that the model learns. The table holds |V| times d_model parameters, so every token added to the vocabulary costs d_model parameters">
<title>The embedding table has one row per token in the vocabulary and d_model columns. A token&#x27;s id selects its row, a vector of d_model numbers that the model learns. The table holds |V| times d_model parameters, so every token added to the vocabulary costs d_model parameters</title>
