<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Merging н + и in the word ▁понимать (frequency 4). The pair counts change only around the merge: (о, н) -4, (н, и) -4, (и, м) -4, (о, ни) +4, (ни, м) +4">
