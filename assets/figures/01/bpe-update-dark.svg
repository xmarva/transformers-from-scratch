<text x="14.0" y="214.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">all other pairs keep their counts:</text>
<text x="14.0" y="236.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">(▁, п), (п, о), (м, а), (а, т), (т, ь)</text>
<text x="14.0" y="278.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#E7EAF0">So a merge only has to revisit the words that contain the pair.</text>
