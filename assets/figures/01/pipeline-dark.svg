<text x="697.0" y="70.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">model</text>
<text x="697.0" y="108.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">lesson 2</text>
</svg>