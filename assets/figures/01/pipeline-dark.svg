<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 132" width="760" height="132" role="img" aria-label="Where tokenization sits: raw text is normalized, split into words, merged into subword tokens by BPE and mapped to integer ids that the model reads">
<title>Where tokenization sits: raw text is normalized, split into words, merged into subword tokens by BPE and mapped to integer ids that the model reads</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="132" rx="12" fill="#1A1F26"/>
<text x="14.0" y="26.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">From text to numbers</text>
<rect x="14.0" y="46.0" width="106.0" height="40.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="67.0" y="70.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">raw text</text>
<text x="67.0" y="108.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">as typed</text>
<polyline points="122.0,66.0 138.0,66.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="140.0" y="46.0" width="106.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="193.0" y="70.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">normalize</text>
<text x="193.0" y="108.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">NFKC, quotes</text>
<polyline points="248.0,66.0 264.0,66.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="266.0" y="46.0" width="106.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="319.0" y="70.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">pre-tokenize</text>
<text x="319.0" y="108.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">words, ▁ marks</text>
<polyline points="374.0,66.0 390.0,66.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="392.0" y="46.0" width="106.0" height="40.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="445.0" y="70.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">BPE merges</text>
<text x="445.0" y="108.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#9AA3B2">subword tokens</text>
<polyline points="500.0,66.0 516.0,66.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="518.0" y="46.0" width="106.0" height="40.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="571.0" y="70.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">token ids</text>
