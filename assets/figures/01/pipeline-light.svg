<text x="193.0" y="70.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">normalize</text>
<text x="193.0" y="108.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">NFKC, quotes</text>
<polyline points="248.0,66.0 264.0,66.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="266.0" y="46.0" width="106.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="319.0" y="70.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">pre-tokenize</text>
<text x="319.0" y="108.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">words, ▁ marks</text>
