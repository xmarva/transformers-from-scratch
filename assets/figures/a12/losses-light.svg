<text x="396.0" y="88.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#1D2430">SigLIP, sigmoid</text>
<text x="588.0" y="150.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">each cell on its own:</text>
<text x="588.0" y="168.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">σ(t · cos + b)</text>
<text x="588.0" y="226.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">+1 on the diagonal,</text>
