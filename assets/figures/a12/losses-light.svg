<text x="14.0" y="310.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">a softmax row needs every caption in the batch before it can be normalised</text>
<text x="14.0" y="330.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">a sigmoid cell needs one photo and one caption, so the table can be filled in blocks</text>
