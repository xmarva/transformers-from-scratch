<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="Two losses on the same table of pairs. On the left, CLIP&#x27;s: each row of the table is a softmax over all the captions, asking which one caption belongs to this photo, and each column is a softmax over all the photos; every row needs every column. On the right, SigLIP&#x27;s: each cell on its own is a yes-or-no question, the diagonal cells should say yes and the others no, through a sigmoid of a scaled similarity plus a bias; cells don&#x27;t depend on each other, so the table can be computed in pieces">
<title>Two losses on the same table of pairs. On the left, CLIP&#x27;s: each row of the table is a softmax over all the captions, asking which one caption belongs to this photo, and each column is a softmax over all the photos; every row needs every column. On the right, SigLIP&#x27;s: each cell on its own is a yes-or-no question, the diagonal cells should say yes and the others no, through a sigmoid of a scaled similarity plus a bias; cells don&#x27;t depend on each other, so the table can be computed in pieces</title>
