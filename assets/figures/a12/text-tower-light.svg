<rect x="518.0" y="160.0" width="11.0" height="11.0" rx="1" fill="#6A55D8"/>
<text x="440.0" y="190.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">3  the causal mask: each token</text>
<text x="440.0" y="208.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">sees itself and what came before</text>
<polyline points="313.0,221.0 313.0,262.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
