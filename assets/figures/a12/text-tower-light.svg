<rect x="453.0" y="160.0" width="11.0" height="11.0" rx="1" fill="#ECE8FC"/>
<rect x="466.0" y="160.0" width="11.0" height="11.0" rx="1" fill="#ECE8FC"/>
<rect x="479.0" y="160.0" width="11.0" height="11.0" rx="1" fill="#ECE8FC"/>
<rect x="492.0" y="160.0" width="11.0" height="11.0" rx="1" fill="#ECE8FC"/>
