<text x="313.0" y="286.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">&lt;end&gt;&#x27;s output</text>
<polyline points="384.0,282.0 414.0,282.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="418.0" y="266.0" width="150.0" height="32.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="493.0" y="286.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">norm, 512 → 512</text>
<polyline points="569.0,282.0 597.0,282.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="601.0" y="277.0" width="70.0" height="10.0" rx="1" fill="#C27A0E"/>
<text x="20.0" y="326.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">4  only the end token has read the whole caption: its vector is the caption&#x27;s vector</text>
<text x="20.0" y="346.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">5  divided by its length, it lands on a sphere, where similarity is a dot product</text>
