<rect x="201.4" y="136.0" width="28.5" height="9.0" rx="1" fill="#FCF0DA"/>
<rect x="242.9" y="136.0" width="35.7" height="9.0" rx="1" fill="#FCF0DA"/>
<rect x="291.6" y="136.0" width="42.9" height="9.0" rx="1" fill="#FCF0DA"/>
<text x="20.0" y="166.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">2  each token&#x27;s embedding plus a learned position</text>
<rect x="20.0" y="180.0" width="380.0" height="40.0" rx="9" fill="#E1F3F0" stroke="#0F8C7E" stroke-width="1.5"/>
<text x="210.0" y="204.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#0B6B60" xml:space="preserve">12 blocks, causal attention</text>
<rect x="440.0" y="82.0" width="11.0" height="11.0" rx="1" fill="#6A55D8"/>
<rect x="440.0" y="95.0" width="11.0" height="11.0" rx="1" fill="#ECE8FC"/>
