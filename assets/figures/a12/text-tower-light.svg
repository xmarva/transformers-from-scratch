<rect x="492.0" y="134.0" width="11.0" height="11.0" rx="1" fill="#6A55D8"/>
<rect x="440.0" y="147.0" width="11.0" height="11.0" rx="1" fill="#ECE8FC"/>
<rect x="453.0" y="147.0" width="11.0" height="11.0" rx="1" fill="#ECE8FC"/>
