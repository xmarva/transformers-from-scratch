<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Two ways to get one vector out of a Vision Transformer. CLIP&#x27;s image tower, like lesson 11&#x27;s ViT, puts a class token in front of the patches and takes its output. SigLIP has no class token: after the blocks a single learned query, the probe, attends to all the patch outputs, and its result, through a layer norm and an MLP with a residual connection, is the image&#x27;s vector">
<title>Two ways to get one vector out of a Vision Transformer. CLIP&#x27;s image tower, like lesson 11&#x27;s ViT, puts a class token in front of the patches and takes its output. SigLIP has no class token: after the blocks a single learned query, the probe, attends to all the patch outputs, and its result, through a layer norm and an MLP with a residual connection, is the image&#x27;s vector</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="300" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">Where the image&#x27;s vector comes from</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">CLIP reads a class token; SigLIP lets one learned query attend to every patch</text>
<text x="20.0" y="88.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">CLIP</text>
<rect x="20.0" y="104.0" width="33.4" height="26.0" rx="7" fill="#F2667C" stroke="#F2667C" stroke-width="1.5"/>
<text x="36.7" y="120.8" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#1A1F26" xml:space="preserve">CLS</text>
<rect x="70.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="96.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="122.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="148.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="174.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<text x="206.0" y="122.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">49 patches</text>
<rect x="20.0" y="148.0" width="196.0" height="32.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="118.0" y="168.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">12 blocks</text>
<polyline points="40.0,181.0 40.0,210.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="20.0" y="214.0" width="140.0" height="30.0" rx="9" fill="#F2667C" stroke="#F2667C" stroke-width="1.5"/>
<text x="90.0" y="233.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">CLS output</text>
<text x="20.0" y="270.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">the class token&#x27;s output, normalised and projected</text>
<text x="420.0" y="88.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">SigLIP</text>
<rect x="420.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="446.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="472.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="498.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="524.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="550.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="576.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<rect x="602.0" y="108.0" width="20.0" height="18.0" rx="1" fill="#12302C"/>
<text x="640.0" y="122.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">196 patches</text>
<rect x="420.0" y="148.0" width="200.0" height="32.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="520.0" y="168.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">12 blocks</text>
<rect x="470.0" y="214.0" width="110.0" height="30.0" rx="9" fill="#F2667C" stroke="#F2667C" stroke-width="1.5"/>
<text x="525.0" y="233.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1A1F26" xml:space="preserve">probe</text>
<polyline points="525.0,214.0 430.0,181.0" fill="none" stroke="#9C8CF5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="525.0,214.0 456.0,181.0" fill="none" stroke="#9C8CF5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="525.0,214.0 482.0,181.0" fill="none" stroke="#9C8CF5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="525.0,214.0 508.0,181.0" fill="none" stroke="#9C8CF5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="525.0,214.0 534.0,181.0" fill="none" stroke="#9C8CF5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="525.0,214.0 560.0,181.0" fill="none" stroke="#9C8CF5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="525.0,214.0 586.0,181.0" fill="none" stroke="#9C8CF5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="525.0,214.0 612.0,181.0" fill="none" stroke="#9C8CF5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="581.0,229.0 607.0,229.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="611.0" y="214.0" width="130.0" height="30.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="676.0" y="233.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">norm, MLP, +</text>
<text x="420.0" y="270.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">one query: a weighted average of the patches</text>
</svg>