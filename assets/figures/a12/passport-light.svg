<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-label="CLIP ViT-B/32&#x27;s passport. Published January 2021 by OpenAI, weights under the MIT licence. Type: two encoders, an image tower and a text tower, about 151 million parameters, trained with a contrastive loss. Image tower: a Vision Transformer, 224 by 224 pixels in 49 patches of 32, twelve blocks of width 768. Text tower: twelve blocks of width 512 with eight heads, causal attention, at most 77 tokens, the end token&#x27;s output. Space: 512 numbers, cosine similarity scaled by a learned temperature. Training: 400 million image and text pairs collected from the internet, batches of 32,768. Good at: zero-shot classification, search, the image or text encoder of other models. Not for: counting, reading small text reliably, telling apart scenes that differ only in word order">
<title>CLIP ViT-B/32&#x27;s passport. Published January 2021 by OpenAI, weights under the MIT licence. Type: two encoders, an image tower and a text tower, about 151 million parameters, trained with a contrastive loss. Image tower: a Vision Transformer, 224 by 224 pixels in 49 patches of 32, twelve blocks of width 768. Text tower: twelve blocks of width 512 with eight heads, causal attention, at most 77 tokens, the end token&#x27;s output. Space: 512 numbers, cosine similarity scaled by a learned temperature. Training: 400 million image and text pairs collected from the internet, batches of 32,768. Good at: zero-shot classification, search, the image or text encoder of other models. Not for: counting, reading small text reliably, telling apart scenes that differ only in word order</title>
