<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-label="SigLIP&#x27;s loss computed in blocks across three devices. Each device keeps its own photos and starts with its own captions, filling the diagonal block of the table; then the captions move one device along the ring and each device fills the next block, twice more, until every block is filled. No device ever holds the whole table, and no row has to be normalised over all the captions">
<title>SigLIP&#x27;s loss computed in blocks across three devices. Each device keeps its own photos and starts with its own captions, filling the diagonal block of the table; then the captions move one device along the ring and each device fills the next block, twice more, until every block is filled. No device ever holds the whole table, and no row has to be normalised over all the captions</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="372" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">The sigmoid loss, filled block by block on three devices</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">each device keeps its photos; the captions travel around the ring</text>
<text x="174.0" y="126.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">device 1</text>
<text x="228.0" y="78.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">captions 1</text>
<rect x="190.0" y="90.0" width="76.0" height="76.0" rx="9" fill="#D23F57" stroke="#D23F57" stroke-width="1.5"/>
<text x="228.0" y="132.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">step 1</text>
<rect x="274.0" y="90.0" width="76.0" height="76.0" rx="9" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="312.0" y="132.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">step 2</text>
<rect x="358.0" y="90.0" width="76.0" height="76.0" rx="9" fill="#E1F3F0" stroke="#0F8C7E" stroke-width="1.5"/>
<text x="396.0" y="132.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#0B6B60" xml:space="preserve">step 3</text>
<text x="174.0" y="210.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">device 2</text>
<text x="312.0" y="78.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">captions 2</text>
<rect x="190.0" y="174.0" width="76.0" height="76.0" rx="9" fill="#E1F3F0" stroke="#0F8C7E" stroke-width="1.5"/>
<text x="228.0" y="216.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#0B6B60" xml:space="preserve">step 3</text>
<rect x="274.0" y="174.0" width="76.0" height="76.0" rx="9" fill="#D23F57" stroke="#D23F57" stroke-width="1.5"/>
<text x="312.0" y="216.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">step 1</text>
<rect x="358.0" y="174.0" width="76.0" height="76.0" rx="9" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="396.0" y="216.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">step 2</text>
<text x="174.0" y="294.0" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">device 3</text>
<text x="396.0" y="78.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">captions 3</text>
<rect x="190.0" y="258.0" width="76.0" height="76.0" rx="9" fill="#ECE8FC" stroke="#6A55D8" stroke-width="1.5"/>
<text x="228.0" y="300.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#4B39B5" xml:space="preserve">step 2</text>
<rect x="274.0" y="258.0" width="76.0" height="76.0" rx="9" fill="#E1F3F0" stroke="#0F8C7E" stroke-width="1.5"/>
<text x="312.0" y="300.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#0B6B60" xml:space="preserve">step 3</text>
<rect x="358.0" y="258.0" width="76.0" height="76.0" rx="9" fill="#D23F57" stroke="#D23F57" stroke-width="1.5"/>
<text x="396.0" y="300.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">step 1</text>
<text x="476.0" y="120.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">step 1: own captions, the diagonal</text>
<text x="476.0" y="150.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">step 2: the neighbour&#x27;s captions</text>
<text x="476.0" y="180.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">step 3: the last ones</text>
<text x="476.0" y="230.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#5B6575">each block&#x27;s loss is added up at once</text>
<text x="14.0" y="350.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">a softmax row would need the captions of all three devices before its loss exists</text>
</svg>