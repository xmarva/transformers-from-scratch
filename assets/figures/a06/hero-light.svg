<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="The decoder block of a modern LLM, with each change since Llama marked where it acts. Grouped-query attention shares one key-value head among several query heads and shrinks the KV cache. A sliding window limits how far back a local layer can look. QK-norm normalises queries and keys before their dot product, and soft-capping squashes the scores with a tanh. The rest of the block is Llama&#x27;s: RMSNorm before each part, rotary positions, a SwiGLU feed-forward network">
<title>The decoder block of a modern LLM, with each change since Llama marked where it acts. Grouped-query attention shares one key-value head among several query heads and shrinks the KV cache. A sliding window limits how far back a local layer can look. QK-norm normalises queries and keys before their dot product, and soft-capping squashes the scores with a tanh. The rest of the block is Llama&#x27;s: RMSNorm before each part, rotary positions, a SwiGLU feed-forward network</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6575"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C27A0E"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8C7E"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D23F57"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A55D8"/></marker>
</defs>
<rect width="760" height="352" rx="12" fill="#FFFFFF"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#1D2430">Where the changes since Llama act in a decoder block</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">two of them save memory while the model generates, two keep training stable</text>
<rect x="14.0" y="84.0" width="94.0" height="40.0" rx="9" fill="#6A55D8" stroke="#6A55D8" stroke-width="1.5"/>
<text x="61.0" y="108.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">projections</text>
<polyline points="108.0,104.0 118.0,104.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="118.0" y="84.0" width="94.0" height="40.0" rx="9" fill="#6A55D8" stroke="#6A55D8" stroke-width="1.5"/>
<text x="165.0" y="108.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">QK-norm</text>
<polyline points="212.0,104.0 222.0,104.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="222.0" y="84.0" width="94.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="269.0" y="108.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">RoPE</text>
<polyline points="316.0,104.0 326.0,104.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="326.0" y="84.0" width="94.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="373.0" y="108.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">q·k / √d</text>
<polyline points="420.0,104.0 430.0,104.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="430.0" y="84.0" width="94.0" height="40.0" rx="9" fill="#6A55D8" stroke="#6A55D8" stroke-width="1.5"/>
<text x="477.0" y="108.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">soft-cap</text>
<polyline points="524.0,104.0 534.0,104.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="534.0" y="84.0" width="94.0" height="40.0" rx="9" fill="#6A55D8" stroke="#6A55D8" stroke-width="1.5"/>
<text x="581.0" y="108.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#FFFFFF" xml:space="preserve">mask</text>
<polyline points="628.0,104.0 638.0,104.0" fill="none" stroke="#5B6575" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="638.0" y="84.0" width="94.0" height="40.0" rx="9" fill="#F6F7F9" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="685.0" y="108.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#1D2430" xml:space="preserve">softmax · V</text>
<polyline points="61.0,125.0 61.0,146.0 103.0,146.0 103.0,167.0" fill="none" stroke="#6A55D8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="14.0" y="168.0" width="178.0" height="118.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="24.0" y="192.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#1D2430">grouped queries</text>
<text x="24.0" y="214.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">fewer key-value heads</text>
<text x="24.0" y="233.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">a smaller KV cache</text>
<text x="24.0" y="252.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">nearly every model</text>
<text x="24.0" y="274.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">memory</text>
<polyline points="165.0,125.0 165.0,146.0 287.0,146.0 287.0,167.0" fill="none" stroke="#6A55D8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="198.0" y="168.0" width="178.0" height="118.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="208.0" y="192.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#1D2430">QK-norm</text>
<text x="208.0" y="214.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">RMSNorm on q and k</text>
<text x="208.0" y="233.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">scores stay bounded</text>
<text x="208.0" y="252.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">OLMo 2, Gemma 3, Qwen3</text>
<text x="208.0" y="274.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">stability</text>
<polyline points="477.0,125.0 477.0,146.0 471.0,146.0 471.0,167.0" fill="none" stroke="#6A55D8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="382.0" y="168.0" width="178.0" height="118.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="392.0" y="192.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#1D2430">soft-cap</text>
<text x="392.0" y="214.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">50 · tanh(s / 50)</text>
<text x="392.0" y="233.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">a ceiling on scores</text>
<text x="392.0" y="252.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">Gemma 2</text>
<text x="392.0" y="274.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">stability</text>
<polyline points="581.0,125.0 581.0,146.0 655.0,146.0 655.0,167.0" fill="none" stroke="#6A55D8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="566.0" y="168.0" width="178.0" height="118.0" rx="9" fill="#FFFFFF" stroke="#B9C0CB" stroke-width="1.5"/>
<text x="576.0" y="192.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#1D2430">sliding window</text>
<text x="576.0" y="214.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">local layers see only</text>
<text x="576.0" y="233.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">the last W tokens</text>
<text x="576.0" y="252.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">Mistral, Gemma, gpt-oss</text>
<text x="576.0" y="274.0" text-anchor="start" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#5B6575">memory</text>
<text x="14.0" y="316.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">in most models the rest is Llama&#x27;s: RMSNorm before attention and before the feed-forward</text>
<text x="14.0" y="336.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#5B6575">network, rotary positions, a SwiGLU feed-forward network, residual connections, almost no biases</text>
</svg>