<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">the same residual stream and causal mask; almost everything inside has been replaced</text>
<text x="14.0" y="84.0" text-anchor="start" font-family="IBM Plex Sans" font-size="14" font-weight="600" fill="#E7EAF0">GPT-2, 2019 (lesson 4)</text>
