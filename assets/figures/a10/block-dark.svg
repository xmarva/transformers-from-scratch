<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="The Mamba block of mamba-130m with the shape of every tensor for L tokens. The input, L × 768, is widened by in_proj to L × 3,072 and split into a stream u and a gate z, L × 1,536 each. The stream goes through a causal convolution of width 4 and SiLU. x_proj turns it into a step seed of 48 numbers and B and C, 16 numbers each, per token; dt_proj and softplus give a step Δ for each of the 1,536 channels. The selective scan runs 1,536 channels with a state of 16 each, using A (1,536 × 16) and the skip D. Its output is multiplied by SiLU of the gate and out_proj narrows it back to L × 768">
<title>The Mamba block of mamba-130m with the shape of every tensor for L tokens. The input, L × 768, is widened by in_proj to L × 3,072 and split into a stream u and a gate z, L × 1,536 each. The stream goes through a causal convolution of width 4 and SiLU. x_proj turns it into a step seed of 48 numbers and B and C, 16 numbers each, per token; dt_proj and softplus give a step Δ for each of the 1,536 channels. The selective scan runs 1,536 channels with a state of 16 each, using A (1,536 × 16) and the skip D. Its output is multiplied by SiLU of the gate and out_proj narrows it back to L × 768</title>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker>
<marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F0B04A"/></marker>
<marker id="arrow-enc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3CC2B0"/></marker>
<marker id="arrow-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2667C"/></marker>
<marker id="arrow-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C8CF5"/></marker>
</defs>
<rect width="760" height="470" rx="12" fill="#1A1F26"/>
<text x="14.0" y="28.0" text-anchor="start" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#E7EAF0">One Mamba block of mamba-130m, with every shape</text>
<text x="14.0" y="50.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">L tokens; D = 768, E = 1,536, N = 16, R = 48</text>
<rect x="260.0" y="66.0" width="200.0" height="32.0" rx="9" fill="#362A14" stroke="#F0B04A" stroke-width="1.5"/>
<text x="360.0" y="86.5" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#F6C878" xml:space="preserve">x   L × 768</text>
<polyline points="360.0,99.0 360.0,117.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="260.0" y="118.0" width="200.0" height="32.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="360.0" y="138.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">in_proj → L × 3,072</text>
<polyline points="330.0,151.0 200.0,177.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="390.0,151.0 560.0,177.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="196.0" y="172.0" text-anchor="end" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">u</text>
<text x="566.0" y="172.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">z, the gate</text>
<rect x="110.0" y="178.0" width="180.0" height="32.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="200.0" y="198.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">conv1d, width 4, SiLU</text>
<polyline points="200.0,211.0 200.0,229.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="110.0" y="230.0" width="180.0" height="32.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="200.0" y="250.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">x_proj → 48 + 16 + 16</text>
<polyline points="150.0,263.0 150.0,283.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="20.0" y="284.0" width="240.0" height="32.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="140.0" y="304.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">dt_proj, softplus → Δ  L × 1,536</text>
<polyline points="250.0,263.0 330.0,335.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="318.0" y="300.0" text-anchor="start" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">B, C   L × 16</text>
<polyline points="140.0,317.0 250.0,336.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="210.0" y="337.0" width="260.0" height="40.0" rx="9" fill="#9C8CF5" stroke="#9C8CF5" stroke-width="1.5"/>
<text x="340.0" y="362.0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#E7EAF0">selective scan   A 1,536 × 16, D</text>
<polyline points="109.0,220.0 8.0,220.0 8.0,357.0 209.0,357.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16.0" y="380.0" text-anchor="start" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#9AA3B2">u also enters the scan</text>
<rect x="520.0" y="284.0" width="140.0" height="32.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="590.0" y="304.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">SiLU</text>
<polyline points="590.0,211.0 590.0,283.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="560.0,178.0 590.0,178.0 590.0,211.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="471.0,357.0 560.0,357.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<polyline points="590.0,317.0 590.0,340.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="560.0" y="341.0" width="60.0" height="32.0" rx="9" fill="#1A1F26" stroke="#4A5361" stroke-width="1.5"/>
<text x="590.0" y="361.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">⊗</text>
<polyline points="590.0,374.0 590.0,398.0" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="500.0" y="399.0" width="180.0" height="32.0" rx="9" fill="#20262E" stroke="#4A5361" stroke-width="1.5"/>
<text x="590.0" y="419.6" text-anchor="middle" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#E7EAF0" xml:space="preserve">out_proj → L × 768</text>
<text x="14.0" y="456.0" text-anchor="start" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#9AA3B2">no attention and no MLP: 24 of these blocks, with RMSNorm and a residual around each, are the model</text>
</svg>